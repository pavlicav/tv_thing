[pytest]
# The tests live in tests/ and import the checkout's modules, and the gate's tools in scripts/.
pythonpath = . scripts
markers =
    slow: marks tests that run the full ATSC scan (~5 minutes)
    api: marks tests that need a running TV Thing server
    hardware: marks tests that need the FM tuner enabled (/dev/radio0)
    resource: marks the bounded real-stream host resource gate
