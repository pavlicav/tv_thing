# systemd drop-in for apache2 once it is TV Thing's front door:
#   sudo install -D -m 644 deploy/apache/apache2-front-door.conf \
#       /etc/systemd/system/apache2.service.d/tv-thing-front-door.conf
#   sudo systemctl daemon-reload
# It must not start before the LAN addresses it listens on exist, and must come back if it dies.
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
Restart=on-failure
RestartSec=5
