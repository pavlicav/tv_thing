# TV Thing's front door: Apache owns :8080 (Phase 2 of the split, INVARIANTS.md).
# Install at the cut-over (RUNBOOK.md), not before: until then tv-thing itself binds :8080.
#   sudo cp deploy/apache/tv-thing-front-door.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http headers alias && sudo a2ensite tv-thing-front-door
#   sudo apache2ctl configtest
#
# Explicit addresses, never *:8080: another service holds tailscale0's :8080. The LAN
# addresses are static, so no ip_nonlocal_bind; apache2.service waits for the network
# (deploy/apache/apache2-front-door.conf).
Listen 127.0.0.1:8080
Listen 192.168.1.98:8080
Listen 10.0.0.98:8080

Define TV_THING_FEED_PORT 8086
Define TV_THING_CONTROL_PORT 8087

<VirtualHost 127.0.0.1:8080 192.168.1.98:8080 10.0.0.98:8080>
    ServerName tv-thing-front-door
    Include /home/vivian/tv_thing/deploy/apache/tv-thing-routes.conf
</VirtualHost>

# /tv/ on the main site, the same way (replacing viviserv-proxy.conf's TV Thing lines).
Include /home/vivian/tv_thing/deploy/apache/tv-thing-tv-routes.conf
