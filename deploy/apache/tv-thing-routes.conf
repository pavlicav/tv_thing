# TV Thing's routes behind its front door on :8080 (Phase 2 of the split, INVARIANTS.md).
# Included inside a <VirtualHost> after these are defined (the ports of the two services):
#   Define TV_THING_FEED_PORT     8086
#   Define TV_THING_CONTROL_PORT  8087
# scripts/staged_split_check.sh runs these same rules in a private Apache on scratch ports.
#
# The first matching ProxyPass wins, so the most specific come first.

ProxyRequests Off
ProxyPreserveHost On
# Server-sent events (a band rescan) and long downloads.
ProxyTimeout 3600

# Never routed: control's own /internal/ (the relay's resolver) and the feed's API.
ProxyPass /internal/ !
ProxyPass /feed/v1/ !
RedirectMatch 404 ^/(internal|feed/v1)(/|$)

# The feed: lane playlists and segments, the relays, the slide channels' video.
ProxyPass        /stream/  http://127.0.0.1:${TV_THING_FEED_PORT}/stream/  flushpackets=on
ProxyPassReverse /stream/  http://127.0.0.1:${TV_THING_FEED_PORT}/stream/

# Control: the API, the pages, everything else.
ProxyPass        /  http://127.0.0.1:${TV_THING_CONTROL_PORT}/  flushpackets=on
ProxyPassReverse /  http://127.0.0.1:${TV_THING_CONTROL_PORT}/

# While control is down (a restart), the API still answers in JSON. Control's own 503s (its
# feed not answering) pass through as they are.
<Location /api/>
    ErrorDocument 503 "{\"ok\": false, \"error\": {\"code\": \"control_unavailable\", \"message\": \"TV Thing's control service is restarting; try again in a few seconds\"}}"
    Header always set Content-Type "application/json" "expr=%{REQUEST_STATUS} == 503"
</Location>
