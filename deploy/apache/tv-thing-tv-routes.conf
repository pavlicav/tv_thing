# TV Thing under /tv/ on the main site (http://viviserv/tv/), split (Phase 2). Replaces the
# old "ProxyPass /tv/ http://127.0.0.1:8080/" lines in viviserv-proxy.conf: going straight to
# the two services, never through Apache's own :8080 a second time.
# Needs TV_THING_FEED_PORT and TV_THING_CONTROL_PORT defined (tv-thing-front-door.conf does).

# Relative URLs in the pages need the trailing slash.
RedirectMatch ^/tv$ /tv/

ProxyPass /tv/internal/ !
ProxyPass /tv/feed/v1/ !
RedirectMatch 404 ^/tv/(internal|feed/v1)(/|$)

ProxyPass        /tv/stream/  http://127.0.0.1:${TV_THING_FEED_PORT}/stream/  flushpackets=on
ProxyPassReverse /tv/stream/  http://127.0.0.1:${TV_THING_FEED_PORT}/stream/

ProxyPass        /tv/  http://127.0.0.1:${TV_THING_CONTROL_PORT}/  flushpackets=on
ProxyPassReverse /tv/  http://127.0.0.1:${TV_THING_CONTROL_PORT}/

<Location /tv/api/>
    ErrorDocument 503 "{\"ok\": false, \"error\": {\"code\": \"control_unavailable\", \"message\": \"TV Thing's control service is restarting; try again in a few seconds\"}}"
    Header always set Content-Type "application/json" "expr=%{REQUEST_STATUS} == 503"
</Location>
