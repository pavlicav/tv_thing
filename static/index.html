<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Thing</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="app.css">
  <style>
    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--panel-w);
      grid-template-rows: var(--header-h) 1fr;
      grid-template-areas: "top top" "stage panel";
      height: 100vh;
    }
    .topbar { grid-area: top; }

    /* Lowkey set-top box: the stage and channel list borrow the guide's navy
       glass and gold highlight. Scoped here, not :root, so the shared top
       bar looks the same on every page. */
    .stage, .panel {
      --stb-font: Tiresias, "Tiresias Screenfont", Verdana, Tahoma, "DejaVu Sans", sans-serif;
      --bg: #040a1c;
      --surface: #081231;
      --surface-2: #0d1a42;
      --surface-3: #142656;
      --border: #16244d;
      --border-strong: #22386e;
      --text-dim: #b3c2e8;
      --text-mute: #7185b8;
      --accent: #ffd23f;
      --accent-soft: rgba(255, 210, 63, 0.11);
      --accent-line: rgba(255, 210, 63, 0.42);
      --banner-min: 124px;
    }
    .stage {
      grid-area: stage;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #000;
    }
    .panel {
      grid-area: panel;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
    }

    /* ---- Viewport ---- */
    /* The picture takes exactly 16:9 of the width, up to what leaves room for
       the info banner; the banner gets every pixel that used to be black
       letterbox above and below the video. */
    .viewport {
      position: relative;
      flex: 0 1 auto;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: calc(100% - var(--banner-min));
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }
    .live-controls { position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 30px 14px 12px;
      background: linear-gradient(180deg, transparent, rgba(2, 6, 22, .9));
      color: #fff; font: 700 12px/1 var(--stb-font);
      text-shadow: 1px 1px 0 #000;
      transition: opacity .3s var(--ease); }
    .viewport.idle .live-controls:not(:focus-within) { opacity: 0; pointer-events: none; }
    .viewport.idle { cursor: none; }
    .live-controls button {
      padding: 6px 13px; cursor: pointer;
      font: inherit; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.6);
      background: linear-gradient(180deg, #4a6fc4 0%, #2a4d9e 50%, #1f3c80 51%, #2a4d9e 100%);
      border: 1px solid #0b1a44; border-radius: 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 1px 2px rgba(0,0,0,.5);
    }
    .live-controls button:hover:not(:disabled) { filter: brightness(1.15); }
    .live-controls button:disabled { opacity: .45; cursor: default; }
    .live-controls label { display: flex; align-items: center; gap: 6px; color: #b3c2e8; }
    .live-controls input { width: 90px; accent-color: #ffd23f; }
    .live-controls :focus-visible { outline: 2px solid #ffd23f; outline-offset: 3px; }
    /* Slides have no sound and no live edge: Fullscreen is all there is. */
    .live-controls.slides > :not(#live-fullscreen) { visibility: hidden; }
    #live-message { flex: 1; color: #ffd23f; letter-spacing: .06em; }
    .hidden { display: none !important; }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-mute);
      background:
        repeating-linear-gradient(0deg, transparent, transparent 2px,
          rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 4px),
        radial-gradient(ellipse at center, #131519 0%, #000 75%);
    }
    .placeholder-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .placeholder-sub { font-size: 12px; color: #4a5058; }

    /* ---- The station's slide channels (the Sports Guide), a page of their own ---- */
    .slide-stage {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      background: #000; pointer-events: none;   /* the controls still wake on a hover */
    }

    /* ---- Radio now-playing ---- */
    .radio-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 40%, #16191f 0%, #08090b 70%);
    }
    .freq-readout {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .freq-value {
      font-size: clamp(48px, 11vw, 88px);
      font-weight: 300;
      letter-spacing: -0.02em;
      color: var(--accent);
      text-shadow: 0 0 40px rgba(224, 169, 74, 0.28);
    }
    .freq-unit {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--text-mute);
      text-transform: uppercase;
    }
    .radio-name {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-align: center;
    }
    .radio-format { font-size: 12.5px; color: var(--text-mute); }
    .radio-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .radio-audio {
      width: min(420px, 100%);
      height: 34px;
    }
    .tuner-strip {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ---- Info banner: the strip a cable box shows on a channel change ---- */
    .banner {
      flex: 1 0 var(--banner-min);
      min-height: var(--banner-min);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 18px;
      padding: 14px 18px;
      font-family: var(--stb-font);
      color: #fff;
      background:
        radial-gradient(120% 140% at 50% 0%, #13306f 0%, transparent 70%),
        linear-gradient(180deg, #0a1d4a, #040a1c);
      border-top: 2px solid #030a1f;
      box-shadow: inset 0 1px 0 rgba(138, 164, 220, .35);
      overflow: hidden;
    }
    .now-playing {
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      min-width: 92px; max-width: 200px;
    }
    .bn-num {
      font: 700 30px/1 var(--stb-font); letter-spacing: -.01em;
      text-shadow: 2px 2px 0 #000;
      font-variant-numeric: tabular-nums;
    }
    .now-playing .np-title {
      font: 700 13px/1.2 var(--stb-font); color: #ffd23f;
      max-width: 100%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .now-playing .np-sub {
      font: 700 11px/1.3 var(--stb-font); color: var(--text-mute);
      max-width: 100%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .bn-body {
      min-width: 0; display: flex; flex-direction: column; gap: 6px;
      padding-left: 18px; border-left: 1px solid rgba(138, 164, 220, .25);
    }
    .bn-row { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .bn-k {
      flex-shrink: 0; width: 3.4em;
      font: 700 10.5px/1 var(--stb-font); letter-spacing: .1em; color: var(--text-mute);
    }
    .bn-title {
      min-width: 0; font: 700 17px/1.25 var(--stb-font);
      text-shadow: 1px 1px 0 #000;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bn-row.next .bn-title { font-size: 13.5px; color: var(--text-dim); text-shadow: none; }
    .bn-time {
      flex-shrink: 0; font: 700 12px/1 var(--stb-font); color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }
    .bn-cc {
      flex-shrink: 0; font: 700 9.5px/1 var(--stb-font); padding: 2px 4px 1px;
      border: 1px solid rgba(255,255,255,.55); border-radius: 2px; color: #fff;
    }
    .bn-progress {
      height: 5px; margin: 1px 0 3px calc(3.4em * 10.5 / 17 + 10px);
      max-width: 420px;
      background: #030a1f; border: 1px solid rgba(138, 164, 220, .35);
    }
    .bn-progress i {
      display: block; height: 100%;
      background: linear-gradient(180deg, #fff1a8, #ffd23f 50%, #e5a312);
    }
    .bn-desc {
      font: 12.5px/1.45 var(--stb-font); color: var(--text-dim);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      max-width: 90ch;
    }
    .bn-none { font: 700 13px/1.4 var(--stb-font); color: var(--text-mute); }

    /* LATER: the next few airings as a short vertical list of guide cells.
       Beside NOW when the banner is wide, under it when it is not. */
    .bn-body { container-type: inline-size; }
    .bn-split { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .bn-now { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .bn-later { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .bn-list {
      list-style: none; display: flex; flex-direction: column; gap: 2px;
      background: #030a1f; border: 2px solid #030a1f;
    }
    .bn-list li {
      display: grid; grid-template-columns: 5.4em minmax(0, 1fr); gap: 8px;
      align-items: baseline; padding: 3px 8px;
      background: linear-gradient(180deg, #2c56b0 0%, #1d3f8c 45%, #16326f 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
    }
    .bn-list b {
      font: 700 11px/1.3 var(--stb-font); color: var(--text-dim);
      white-space: nowrap; font-variant-numeric: tabular-nums;
    }
    .bn-list span {
      font: 700 12.5px/1.3 var(--stb-font); color: #fff;
      text-shadow: 1px 1px 0 rgba(0,0,0,.55);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Stacked, the banner only has room for two rows under NOW. */
    .bn-list li:nth-child(n+3) { display: none; }
    @container (min-width: 560px) {
      .bn-split {
        display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
        gap: 0 22px; align-items: start;
      }
      .bn-list li:nth-child(n+3) { display: grid; }
      .bn-list li:nth-child(n+5) { display: none; }
    }

    .bn-side {
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    }
    .bn-clock {
      font: 700 22px/1 var(--stb-font); text-shadow: 2px 2px 0 #000;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .bn-clock small { font-size: 11px; margin-left: 2px; color: var(--text-dim); }
    .banner .segmented { background: #030a1f; border-color: #22386e; }
    .banner .segmented button { font-family: var(--stb-font); }

    /* ---- Panel ---- */
    .panel-head {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .panel-list { flex: 1; min-height: 0; }

    /* ---- Roku tab ---- */
    .roku-tools { display: flex; flex-direction: column; gap: 8px; }
    .roku-tools-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .roku-lock-text {
      flex: 1; min-width: 0; font-family: var(--stb-font); font-size: 11.5px;
      color: var(--text-mute);
    }
    .roku-lock-text.mine { color: var(--accent); }
    .roku-tools .field[type="date"] { flex: 1; min-width: 0; color-scheme: dark; }
    .list-section {
      position: sticky; top: 0; z-index: 1;
      padding: 7px 14px; font-family: var(--stb-font); font-size: 10.5px;
      font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--accent); background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .roku-remote {
      display: grid; gap: 8px; padding: 12px 14px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .remote-row { display: flex; gap: 6px; justify-content: center; }
    .remote-pad {
      display: grid; grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 40px); gap: 4px; justify-content: center;
    }
    .remote-pad .btn, .remote-row .btn {
      font-family: var(--stb-font); padding: 6px 8px; min-width: 46px;
      justify-content: center;
    }
    .remote-pad .ok { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
    .remote-text { display: flex; gap: 6px; }
    .remote-text .field, .remote-text select { flex: 1; min-width: 0; }
    .remote-hint { font-size: 11px; color: var(--text-mute); text-align: center; }
    /* A phone has no room for every tab beside the nav: the source tabs and
       lock keep their size and the nav scrolls; the banner carries status. */
    @media (max-width: 620px) {
      .topbar-tools { flex-shrink: 0; gap: 6px; padding-left: 6px; }
      .topbar-tools .segmented { flex-shrink: 0; }
      .topbar-tools .segmented button { padding-left: 8px; padding-right: 8px; }
      .topbar-tools .segmented { margin-right: 2px; }
      .topbar-tools .status-pill { display: none; }
      .lock-pill { max-width: 112px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    }
    .panel-foot {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-mute);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .empty {
      padding: 28px 18px;
      text-align: center;
      color: var(--text-mute);
      font-size: 12.5px;
    }
    .panel-notice { padding: 12px 14px; }

    /* Channel list, cable-box style: bold numbers, what is on now, and a
       thin bar for how far into it we are. */
    .panel .item-key { font-family: var(--stb-font); font-weight: 700; color: var(--text-dim); }
    .panel .item-name, .panel .item-sub { display: block; }
    .panel .item-name { font-family: var(--stb-font); font-weight: 700; font-size: 12.5px; }
    .panel .item-sub { font-family: var(--stb-font); font-size: 11.5px; color: var(--text-mute); }
    .panel .list-item { padding: 8px 14px; align-items: center; min-height: 54px; }
    .panel .list-item[aria-current="true"] .item-sub { color: var(--text-dim); }
    /* Nothing to tune: an unplayable game, or a listed one (ESPN Unlimited's NHL). */
    .panel .list-item:disabled { opacity: .5; cursor: default; }
    .panel .list-item:disabled:hover { background: none; color: inherit; }
    .panel .item-tag { font-family: var(--stb-font); font-size: 10px; opacity: .8; }
    .item-bar { display: block; height: 2px; margin-top: 5px; background: var(--border); max-width: 180px; }
    .item-bar i { display: block; height: 100%; background: var(--accent); opacity: .75; }
    .panel-head .section-label, .panel-foot { font-family: var(--stb-font); }
    .source-tabs {
      max-width: min(46vw, 520px);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 1;
    }
    .source-tabs::-webkit-scrollbar { display: none; }

    /* ---- Narrow layout ---- */
    @media (max-width: 900px) {
      html, body { height: auto; }
      .app {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: var(--header-h) auto auto;
        grid-template-areas: "top" "stage" "panel";
        height: auto;
        min-height: 100vh;
      }
      .viewport { aspect-ratio: 16 / 9; flex: none; max-height: none; }
      .banner { flex: none; grid-template-columns: auto minmax(0, 1fr); }
      .bn-side { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; }
      .banner { gap: 12px 14px; padding: 12px 14px; }
      .bn-body { padding-left: 14px; }
    }
    @media (max-width: 620px) {
      .banner { grid-template-columns: minmax(0, 1fr); }
      .now-playing { flex-direction: row; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; max-width: none; }
      .bn-body { padding-left: 0; border-left: 0; }
      .bn-progress { margin-left: 0; }
      .bn-row .bn-k { width: auto; }
      .topbar .status-pill { display: none; }   /* the banner names the channel */
      .panel { border-left: none; border-top: 1px solid var(--border); }
      .panel-list { max-height: none; }
      .topbar { position: sticky; top: 0; z-index: 30; }
    }

    /* ---------- Tuner lock ---------- */

    .lock-pill {
      display: flex; align-items: center; gap: 7px;
      padding: 4px 10px; border-radius: var(--r-full);
      background: rgba(251, 191, 36, .12);
      border: 1px solid rgba(251, 191, 36, .35);
      color: var(--warn); font-size: 12px; font-weight: 550;
      cursor: pointer; white-space: nowrap;
    }
    .lock-pill[hidden] { display: none; }
    .lock-pill:hover { background: rgba(251, 191, 36, .2); }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(6, 7, 9, .72);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-backdrop[hidden] { display: none; }
    .modal {
      width: min(460px, 100%);
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: var(--r-lg); padding: 22px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
    }
    .modal h2 {
      font-size: 15.5px; font-weight: 650; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .modal h2::before { content: "\26A0"; color: var(--warn); }
    .modal p { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }
    .modal .ovr-note {
      color: var(--text-mute); font-size: 12.5px;
      border-left: 2px solid var(--warn); padding-left: 10px;
    }
    .modal-actions {
      display: flex; gap: 9px; justify-content: flex-end; margin-top: 18px;
    }
    .btn-danger {
      background: rgba(248, 113, 113, .14);
      border-color: rgba(248, 113, 113, .45); color: var(--err);
    }
    .btn-danger:hover:not(:disabled) {
      background: rgba(248, 113, 113, .24);
      border-color: rgba(248, 113, 113, .7);
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="topbar">
      <a class="brand" href="./"><span class="brand-mark"></span><span>TV Thing</span></a>
      <nav class="nav" aria-label="Pages">
        <a class="navlink" href="./" aria-current="page">Watch</a>
        <a class="navlink" href="guide.html">Guide</a>
        <a class="navlink" href="vcr.html">VCR</a>
        <a class="navlink" href="cable.html">Cable</a>
        <a class="navlink" href="rescan.html">Scan</a>
        <a class="navlink" href="dx.html">DX</a>
        <a class="navlink" href="roku.html">Roku</a>
        <a class="navlink" href="about.html">About</a>
      </nav>
      <div class="topbar-tools">
        <div class="segmented source-tabs" id="source-tabs" role="tablist" aria-label="Source">
          <button role="tab" id="tab-tv" aria-selected="true">All channels</button>
          <button role="tab" id="tab-antenna" aria-selected="false" title="The antenna's own channel numbers, the way a TV lists them">Antenna</button>
          <button role="tab" id="tab-cable" aria-selected="false">Cable</button>
          <button role="tab" id="tab-roku" aria-selected="false">Roku</button>
          <button role="tab" id="tab-radio" aria-selected="false" hidden>FM Radio</button>
        </div>

        <div class="status-pill">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">Loading…</span>
        </div>

        <button class="lock-pill" id="lock-pill" hidden></button>
      </div>
    </header>

    <main class="stage">
      <div class="viewport">
        <video id="player" playsinline aria-label="Live television"></video>
        <div class="live-controls" id="live-controls" role="group" aria-label="Live television controls">
          <button id="live-play" type="button" disabled aria-label="Play live television">Play</button>
          <button id="live-mute" type="button" aria-label="Mute" aria-pressed="false">Mute</button>
          <label>Volume <input id="live-volume" type="range" min="0" max="1" step="0.05" value="1"></label>
          <button id="live-edge" type="button" disabled>Go live</button>
          <span id="live-message" role="status" aria-live="polite">Waiting for channel</span>
          <button id="live-fullscreen" type="button">Fullscreen</button>
        </div>

        <div class="placeholder" id="placeholder">
          <div class="placeholder-title" id="placeholder-title">No Signal</div>
          <div class="placeholder-sub" id="placeholder-sub">Choose a channel to begin</div>
        </div>

        <iframe class="slide-stage hidden" id="slide-stage" title="VizelVision Sports Guide" allow="autoplay"
                tabindex="-1"></iframe>

        <div class="radio-stage hidden" id="radio-stage">
          <div class="freq-readout">
            <span class="freq-value num" id="radio-freq">88.5</span>
            <span class="freq-unit">MHz</span>
          </div>
          <div>
            <div class="radio-name" id="radio-name">—</div>
            <div class="radio-format" id="radio-format" style="text-align:center"></div>
          </div>
          <div class="radio-meta">
            <div class="tuner-strip">
              <span class="section-label">Signal</span>
              <span class="meter" id="radio-meter" aria-label="Signal strength">
                <i></i><i></i><i></i><i></i><i></i>

          <div class="tuner-strip">

            <button class="btn btn-icon" id="freq-up" title="Up 0.2 MHz">&#9654;</button>
          </div>

      <div class="banner" id="banner">
        <div class="now-playing">
          <div class="bn-num" id="bn-num">– –</div>

        </div>
        <div class="bn-side">
          <div class="bn-clock" id="bn-clock">--:--</div>
          <div class="segmented" id="quality-group" aria-label="Quality">
            <button data-quality="low" aria-selected="false">480p</button>
            <button data-quality="medium" aria-selected="true">720p</button>
            <button data-quality="high" aria-selected="false">1080p</button>

    </main>

    <aside class="panel">
      <div class="panel-head">
        <div class="panel-head-row">
          <span class="section-label" id="panel-label">Channels</span>
          <span class="section-label num" id="panel-count"></span>
        </div>
        <input class="field" id="filter" type="search" placeholder="Filter…" autocomplete="off">
        <div class="roku-tools" id="roku-tools" hidden>
          <div class="roku-tools-row">
            <span class="roku-lock-text" id="roku-lock-text">Roku unlocked</span>
            <button class="btn" id="roku-lock" type="button">Lock Roku</button>
          </div>
          <div class="roku-tools-row">
            <label class="section-label" for="roku-date">Games on</label>
            <input class="field" id="roku-date" type="date">
            <button class="btn" id="roku-stop" type="button" hidden>Stop</button>

      </div>
      <div class="roku-remote" id="roku-remote" role="group" aria-label="Roku remote" hidden>
        <div class="remote-row">
          <button class="btn" data-key="Back" type="button" title="Back (Backspace)">Back</button>
          <button class="btn" data-key="Home" type="button" title="Home">Home</button>
          <button class="btn" data-key="Info" type="button" title="Options">✱</button>
          <button class="btn" data-key="Search" type="button" title="Search">Search</button>
        </div>
        <div class="remote-pad">
          <span></span>
          <button class="btn" data-key="Up" type="button" aria-label="Up">▲</button>
          <span></span>
          <button class="btn" data-key="Left" type="button" aria-label="Left">◀</button>
          <button class="btn ok" data-key="Select" type="button" aria-label="OK">OK</button>
          <button class="btn" data-key="Right" type="button" aria-label="Right">▶</button>
          <span></span>
          <button class="btn" data-key="Down" type="button" aria-label="Down">▼</button>
          <span></span>
        </div>
        <div class="remote-row">
          <button class="btn" data-key="InstantReplay" type="button" title="Instant replay">↺</button>
          <button class="btn" data-key="Rev" type="button" aria-label="Rewind">◀◀</button>
          <button class="btn" data-key="Play" type="button" aria-label="Play or pause">▶❚❚</button>
          <button class="btn" data-key="Fwd" type="button" aria-label="Fast forward">▶▶</button>
        </div>
        <form class="remote-text" id="roku-text-form">
          <input class="field" id="roku-text" type="text" maxlength="64" placeholder="Type into the Roku…" autocomplete="off">
          <button class="btn" type="submit">Send</button>
        </form>
        <div class="remote-text">
          <select class="field" id="roku-apps" aria-label="Launch an app"><option value="">Launch an app…</option></select>
        </div>
        <div class="remote-hint">Arrow keys, Enter and Backspace work too.</div>
      </div>
      <div class="list panel-list scroll" id="list"></div>
      <div class="panel-foot">
        <span id="foot-left">—</span>
        <span id="foot-right"></span>
      </div>
    </aside>

  </div>

  <div class="modal-backdrop" id="override-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true"
         aria-labelledby="ovr-title" aria-describedby="ovr-body">
      <h2 id="ovr-title">Tuner is locked</h2>
      <p id="ovr-body"></p>
      <p class="ovr-note" id="ovr-note"></p>
      <div class="modal-actions">
        <button class="btn" id="ovr-cancel">Leave it alone</button>
        <button class="btn btn-danger" id="ovr-confirm">Override the lock</button>
      </div>
    </div>
  </div>

  <script src="hls.min.js"></script>
  <script src="live-player.js"></script>
  <script src="tunable-channels.js"></script>
  <script>
  (() => {
    "use strict";

    const $ = (id) => document.getElementById(id);
    const FM_UI_ENABLED = false; // backend is retained for compatible hardware

    const els = {
      tabTv: $("tab-tv"), tabAntenna: $("tab-antenna"), tabCable: $("tab-cable"),
      tabRadio: $("tab-radio"), tabRoku: $("tab-roku"),
      rokuTools: $("roku-tools"), rokuLockText: $("roku-lock-text"),
      rokuLock: $("roku-lock"), rokuDate: $("roku-date"), rokuStop: $("roku-stop"),
      rokuRemote: $("roku-remote"), rokuText: $("roku-text"),
      rokuTextForm: $("roku-text-form"), rokuApps: $("roku-apps"),
      statusDot: $("status-dot"), statusText: $("status-text"),
      video: $("player"), placeholder: $("placeholder"), slideStage: $("slide-stage"),
      phTitle: $("placeholder-title"), phSub: $("placeholder-sub"),
      radioStage: $("radio-stage"), radioFreq: $("radio-freq"),
      radioName: $("radio-name"), radioFormat: $("radio-format"),
      radioMeter: $("radio-meter"), radioStereo: $("radio-stereo"),
      radioAudio: $("radio-audio"),
      freqDown: $("freq-down"), freqUp: $("freq-up"),
      npTitle: $("np-title"), npSub: $("np-sub"),
      qualityGroup: $("quality-group"),
      panelLabel: $("panel-label"), panelCount: $("panel-count"),
      filter: $("filter"), list: $("list"),
      footLeft: $("foot-left"), footRight: $("foot-right"),
      lockPill: $("lock-pill"), overrideModal: $("override-modal"),
      ovrTitle: $("ovr-title"), ovrBody: $("ovr-body"), ovrNote: $("ovr-note"),
      ovrCancel: $("ovr-cancel"), ovrConfirm: $("ovr-confirm"),
    };

    const FM_STEP = 0.2, FM_MIN = 87.9, FM_MAX = 107.9;
    els.tabRadio.hidden = !FM_UI_ENABLED;

    const state = {
      lock: null,        // live tuner lock, or null
      mode: "tv",        // all channels, or a source filter
      playing: null,     // stage source: tv, cable, roku, vizelvision, slides, internet, fm or null
      channels: [],
      lineup: null,      // /api/v1/sources lineup: section names and the station's numbers
      houseNumber: null, // which of the station's numbers was chosen
      internet: null,    // the internet stream playing (a Watch list entry)
      slide: null,       // the slide channel on the stage: its tunable entry
      cableChannels: [],
      cableAvailable: false,
      cableTuner: null,
      stations: [],
      radioAvailable: false,
      radioHint: null,
      currentChannelId: null,
      currentCableChannel: null,
      streamId: null,
      tuneSerial: 0,
      tuning: false,
      needsReconnect: false,
      currentFreq: null,
      quality: "medium",
      filter: "",
      locks: {},
      roku: {
        available: false,
        sources: [],       // the Roku's feed sources, in order
        items: {},         // source id -> its feeds
        date: null,        // the day the game lists show
        lane: null,        // /api/v1/status lanes.roku
        apps: [],
        lock: null,        // our own lock: {token, expires_at}, or null
      },
    };

    let hls = null;
    let signalTimer = null;
    let stepTimer = null;
    let sourcePollTimer = null;
    let sourcePollMs = 3000;

    // ---------- helpers ----------

    function setStatus(text, kind) {
      els.statusText.textContent = text;
      els.statusDot.className = "dot" + (kind ? " " + kind : "");
    }

    function setNowPlaying(title, sub) {
      els.npTitle.textContent = title;
      els.npSub.textContent = sub;
      renderBanner();
    }

    // ---------- info banner (now / next from the broadcast guide) ----------

    let guideNow = {};
    const fmtClock = (unix) => new Date(unix * 1000)
      .toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

    // The next few hours on the channel being watched, for the LATER strip.
    const schedule = { number: null, events: [], fetchedAt: 0 };
    const LATER_HOURS = 3;

    async function loadSchedule(number) {
      if (!number) return;
      if (schedule.number === number && Date.now() - schedule.fetchedAt < 300000) return;
      try {
        const res = await fetch(`api/guide?channel=${encodeURIComponent(number)}&hours=${LATER_HOURS + 1}`,
                                { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        const channel = (data.channels || {})[number];
        schedule.number = number;
        schedule.events = channel ? channel.events : [];
        schedule.fetchedAt = Date.now();
      } catch (_) {
        return;
      }
      renderBanner();
    }

    function laterStrip(number, after) {
      if (schedule.number !== number) return "";
      const until = after + LATER_HOURS * 3600;
      const rows = schedule.events
        .filter(e => e.start >= after && e.start < until)
        .slice(0, 4)
        .map(e =>
          `<li title="${escapeHtml(e.title || "No title")} · ${fmtClock(e.start)}">` +
          `<b>${fmtClock(e.start)}</b><span>${escapeHtml(e.title || "No title")}</span></li>`);
      if (!rows.length) return "";
      return `<div class="bn-later"><span class="bn-k">LATER</span>` +
             `<ol class="bn-list">${rows.join("")}</ol></div>`;
    }

    async function loadGuideNow() {
      try {
        const res = await fetch("api/guide/now", { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        guideNow = data.channels || {};
      } catch (_) {
        return;   // the banner keeps what it had; the guide is optional
      }
      renderBanner();
      if (["tv", "antenna", "roku"].includes(state.mode)) renderList();
    }

    // The airing on now, even if the cached "now" has just ended and the
    // "next" one has begun since the last fetch.
    function listingFor(number, now) {
      const entry = guideNow[number];
      if (!entry) return { now: null, next: null };
      const live = (e) => e && e.start <= now && now < e.start + e.duration;
      if (live(entry.now)) return entry;
      if (live(entry.next)) return { now: entry.next, next: null };
      return { now: null, next: entry.next && entry.next.start > now ? entry.next : null };
    }

    function progressOf(event, now) {
      return Math.max(0, Math.min(100, ((now - event.start) / event.duration) * 100));
    }

    // NOW and LATER for one guide row -- an antenna number, or a YouTube TV
    // row's key (youtube-tv/NBC) -- or null when the guide has nothing.
    function listingHtml(key, now) {
      const { now: on, next } = listingFor(key, now);
      if (!on && !next) return null;
      let nowHtml = "";
      if (on) {
        nowHtml +=
          `<div class="bn-row"><span class="bn-k">NOW</span>` +
          `<span class="bn-title">${escapeHtml(on.title || "No title")}</span>` +
          `<span class="bn-time">${fmtClock(on.start)} – ${fmtClock(on.start + on.duration)}</span>` +
          (on.captions ? '<span class="bn-cc">CC</span>' : "") + `</div>` +
          `<div class="bn-progress"><i style="width:${progressOf(on, now).toFixed(1)}%"></i></div>`;
        const about = [on.episode_title, on.description].filter(Boolean).join(" — ");
        if (about) nowHtml += `<div class="bn-desc">${escapeHtml(about)}</div>`;
      }
      loadSchedule(key);
      let later = laterStrip(key, on ? on.start + on.duration : now);
      if (!later && next) {
        later =
          `<div class="bn-row next"><span class="bn-k">NEXT</span>` +
          `<span class="bn-title">${escapeHtml(next.title || "No title")}</span>` +
          `<span class="bn-time">${fmtClock(next.start)}</span></div>`;
      }
      return `<div class="bn-split"><div class="bn-now">${nowHtml}</div>${later}</div>`;
    }

    // A Roku selection's guide key; only YouTube TV's channels have listings.
    function rokuGuideKey(target) {
      return target && target.source_id === "youtube-tv" && target.channel_id
        ? `youtube-tv/${target.channel_id}` : null;
    }

    function renderBanner() {
      const body = $("bn-body");
      const num = $("bn-num");
      const now = Date.now() / 1000;
      if (state.playing === "tv") {
        const ch = state.channels.find(c => c.id === state.currentChannelId);
        num.textContent = ch ? (Number.isInteger(ch.tv_number) ? String(ch.tv_number) : ch.number) : "– –";
        num.title = ch ? `Antenna ${ch.number} · RF ${ch.rf_channel}` : "";
        body.innerHTML = (ch && listingHtml(ch.number, now))
          || '<div class="bn-none">No listing for this channel</div>';
      } else if (state.playing === "vizelvision") {
        num.textContent = state.houseNumber !== null ? String(state.houseNumber) : "VV";
        num.title = "";
        body.innerHTML = '<div class="bn-row"><span class="bn-k">NOW</span>' +
          '<span class="bn-title">VizelVision</span></div>' +
          '<div class="bn-desc">The station’s live broadcast</div>';
      } else if (state.playing === "internet") {
        const entry = state.internet || {};
        num.textContent = entry.number !== null && entry.number !== undefined ? String(entry.number) : "WEB";
        num.title = "";
        body.innerHTML = '<div class="bn-row"><span class="bn-k">NOW</span>' +
          `<span class="bn-title">${escapeHtml(entry.name || "Internet stream")}</span></div>` +
          `<div class="bn-desc">${escapeHtml(entry.sub || "Internet stream")}</div>`;
      } else if (state.playing === "slides") {
        num.textContent = state.slide && state.slide.number !== null ? String(state.slide.number) : "SG";
        num.title = "";
        body.innerHTML = '<div class="bn-row"><span class="bn-k">NOW</span>' +
          '<span class="bn-title">Today’s Sports</span></div>' +
          '<div class="bn-desc">Today’s games by sport, each with the channel it is on</div>';
      } else if (state.playing === "cable") {
        num.textContent = state.currentCableChannel != null ? String(state.currentCableChannel) : "– –";
        num.title = "";
        body.innerHTML = '<div class="bn-none">Analog cable carries no guide</div>';
      } else if (state.playing === "roku") {
        const roku = (state.roku.lane && state.roku.lane.roku) || {};
        const selection = roku.selection;
        const operation = roku.operation;
        // The channel it is on, or on its way to.
        const shown = rokuItem(operation && operation.active ? operation.target : selection);
        num.textContent = shown && Number.isInteger(shown.tv_number) ? String(shown.tv_number)
          : rokuShortName(selection && selection.source_id);
        num.title = "";
        let html = "";
        if (operation && operation.active) {
          html += `<div class="bn-row"><span class="bn-k">SEEK</span>` +
            `<span class="bn-title">${escapeHtml(rokuTargetName(operation.target))}</span></div>` +
            `<div class="bn-desc">${escapeHtml(operation.message || operation.phase || "Navigating")}</div>`;
        } else if (selection && selection.manual) {
          html += '<div class="bn-row"><span class="bn-k">NOW</span>' +
            '<span class="bn-title">Manual Roku</span></div>' +
            '<div class="bn-desc">Drive it with the remote beside the list.</div>';
        } else if (selection && rokuGuideKey(selection) && listingFor(rokuGuideKey(selection), now).now) {
          // A YouTube TV channel: what is on it, from its published listing.
          html += listingHtml(rokuGuideKey(selection), now);
        } else if (selection) {
          const route = selection.resolved_source && selection.resolved_source.label;
          html += `<div class="bn-row"><span class="bn-k">NOW</span>` +
            `<span class="bn-title">${escapeHtml(selection.name || selection.channel_id)}</span>` +
            (route ? `<span class="bn-time">${escapeHtml(route)}</span>` : "") + `</div>` +
            `<div class="bn-desc">Verified on screen ${escapeHtml(ago(selection.age_seconds))}.</div>`;
        } else {
          html += '<div class="bn-none">The Roku is showing something unverified</div>';
        }
        if (operation && !operation.active && operation.state === "failed") {
          html += `<div class="bn-desc">Last navigation failed: ${escapeHtml(operation.message)}</div>`;
        }
        body.innerHTML = html;
      } else {
        num.textContent = "– –";
        num.title = "";
        body.innerHTML = '<div class="bn-none">Choose a channel</div>';
      }
    }

    function tickClock() {
      const time = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      const match = time.match(/^(.*?)\s*([AP]\.?M\.?)$/i);
      $("bn-clock").innerHTML = match
        ? `${escapeHtml(match[1])}<small>${escapeHtml(match[2])}</small>` : escapeHtml(time);
    }
    tickClock();
    setInterval(() => { tickClock(); renderBanner(); }, 20000);
    setInterval(loadGuideNow, 60000);

    // Controls fade away while you watch and come back when you move.
    (() => {
      const viewport = els.video.parentElement;
      let idleTimer = null;
      const wake = () => {
        viewport.classList.remove("idle");
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          if (!els.video.paused) viewport.classList.add("idle");
        }, 3000);
      };
      ["mousemove", "touchstart", "keydown", "focusin"].forEach(event =>
        viewport.addEventListener(event, wake, { passive: true }));
      viewport.addEventListener("mouseleave", () => {
        if (!els.video.paused) viewport.classList.add("idle");
      });
      els.video.addEventListener("pause", wake);
      els.video.addEventListener("playing", wake);
    })();

    let cancelStartup = () => {};
    const liveMessage = $("live-message");
    function goLive() {
      const target = LivePlayer.livePosition(els.video, hls);
      if (target !== null) els.video.currentTime = target;
    }
    function playLive() {
      goLive();
      els.video.play().catch(() => { liveMessage.textContent = "Press Play to watch"; });
    }
    $("live-play").addEventListener("click", () => {
      if (els.video.paused) playLive(); else els.video.pause();
    });
    $("live-edge").addEventListener("click", playLive);
    $("live-mute").addEventListener("click", () => { els.video.muted = !els.video.muted; });
    $("live-volume").addEventListener("input", event => {
      els.video.volume = Number(event.target.value);
      els.video.muted = els.video.volume === 0;
    });
    els.video.addEventListener("volumechange", () => {
      $("live-mute").textContent = els.video.muted ? "Unmute" : "Mute";
      $("live-mute").setAttribute("aria-label", els.video.muted ? "Unmute" : "Mute");
      $("live-mute").setAttribute("aria-pressed", String(els.video.muted));
      $("live-volume").value = els.video.volume;
    });
    ["playing", "pause", "waiting", "timeupdate"].forEach(event => {
      els.video.addEventListener(event, () => {
        $("live-play").textContent = els.video.paused ? "Play" : "Pause";
        $("live-play").setAttribute("aria-label", els.video.paused ? "Play live television" : "Pause television");
        if (event === "waiting") liveMessage.textContent = "Buffering…";
        else if (els.video.paused) liveMessage.textContent = "Paused · resume returns to live";
        else {
          const target = LivePlayer.livePosition(els.video, hls);
          liveMessage.textContent = target !== null && target - els.video.currentTime > 2 ? "Behind live" : "LIVE";
        }
      });
    });
    $("live-fullscreen").addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else if (els.video.parentElement.requestFullscreen) await els.video.parentElement.requestFullscreen();
        else if (els.video.webkitEnterFullscreen) els.video.webkitEnterFullscreen();
      } catch (_) { liveMessage.textContent = "Fullscreen unavailable"; }
    });

    function destroyHls() {
      cancelStartup();
      cancelStartup = () => {};
      if (hls) { hls.destroy(); hls = null; }
    }

    function attachStream(url, media, onFail, onReady) {
      destroyHls();
      liveMessage.textContent = "Buffering…";
      $("live-play").disabled = true;
      $("live-edge").disabled = true;
      let active = true, prepared = false, recoveryAttempts = 0;
      let cancelBuffer = () => {};
      const listeners = [];
      const fail = () => {
        if (!active) return;
        cancelStartup();
        if (onFail) onFail();
      };
      const manifestDeadline = setTimeout(fail, 20000);
      cancelStartup = () => {
        active = false;
        clearTimeout(manifestDeadline);
        cancelBuffer();
        listeners.forEach(([event, fn]) => media.removeEventListener(event, fn));
      };
      const prepare = instance => {
        if (!active || prepared) return;
        prepared = true;
        clearTimeout(manifestDeadline);
        cancelBuffer = LivePlayer.prepare(media, {
          hls: instance,
          onCanPlay: () => {
            if (!active) return;
            $("live-play").disabled = false;
            $("live-edge").disabled = false;
          },
          onReady: () => { if (active && onReady) onReady(); },
          onFail: fail,
          onBlocked: () => { liveMessage.textContent = "Press Play to watch"; },
        });
      };
      if (window.Hls && Hls.isSupported()) {
        const instance = new Hls({
          liveDurationInfinity: true,
          // Wait for four segments on a newly tuned stream. The buffer
          // check below determines when the browser can start smoothly.
          backBufferLength: 8,
          maxBufferLength: 12,
          maxMaxBufferLength: 20,
          liveSyncDurationCount: 4,
          initialLiveManifestSize: 4,
          liveMaxLatencyDurationCount: 8,
        });
        hls = instance;
        instance.on(Hls.Events.MANIFEST_PARSED, () => {
          if (instance !== hls || !active) return;
          prepare(instance);
        });
        instance.on(Hls.Events.ERROR, (_e, data) => {
          if (instance !== hls || !active || !data.fatal) return;
          if (data.type === Hls.ErrorTypes.MEDIA_ERROR && recoveryAttempts++ < 2) {
            instance.recoverMediaError();
            return;
          }
          fail();
        });
        instance.loadSource(url);
        instance.attachMedia(media);
      } else if (media.canPlayType("application/vnd.apple.mpegurl")) {
        const metadata = () => prepare(null);
        listeners.push(["error", fail], ["loadedmetadata", metadata]);
        listeners.forEach(([event, fn]) => media.addEventListener(event, fn));
        media.preload = "auto";
        media.src = url;
      } else {
        fail();
      }
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function fetchWithFallback(primary, fallback, options) {
      let response = await fetch(primary, options);
      if (response.status === 404 && fallback) {
        response = await fetch(fallback, options);
      }
      return response;
    }

    function normalizeStatus(data) {
      if (data && data.api_version === "v1") return data;
      const source = data && data.mode === "tv"
        ? { id: "digital", kind: "digital", name: "Digital TV" }
        : (data && data.mode === "cable"
          ? { id: "cable", kind: "cable", name: "Cable TV" }
          : (data && data.mode === "fm"
            ? { id: "fm", kind: "fm", name: "FM Radio" }
            : null));
      const cableChannel = data && data.mode === "cable"
        ? state.cableChannels.find(
            item => item.number === data.cable_channel
          )
        : null;
      const selection = data && data.mode === "tv" ? data.channel
        : (data && data.mode === "cable" ? {
            channel: data.cable_channel,
            frequency_hz: cableChannel ? cableChannel.frequency_hz : null,
            tuner: data.capture || null,
          }
          : (data && data.mode === "fm" ? data.fm : null));
      return {
        source,
        selection,
        quality: data && data.quality,
        stream: {
          id: data && data.stream_id,
          active: !!(data && data.streaming),
          ready: !!(data && data.stream_ready),
          health: data && data.stream_health,
        },
        fm: data && data.fm,
      };
    }

    async function waitForTvStream(streamId, timeoutMs) {
      const deadline = Date.now() + (timeoutMs || 15000);
      while (Date.now() < deadline) {
        const cacheKey = Date.now();
        const res = await fetchWithFallback(
          `api/v1/status?_=${cacheKey}`,
          `api/status?_=${cacheKey}`,
          { cache: "no-store" },
        );
        if (res.ok) {
          const raw = await res.json();
          const status = normalizeStatus(raw);
          if (raw.lanes) {
            const matching = Object.values(raw.lanes).find(lane => lane.stream.id === streamId);
            if (matching) status.stream = matching.stream;
          }
          if (status.stream && status.stream.id === streamId) {
            if (status.stream.health && !status.stream.health.ok) {
              throw new Error(status.stream.health.reason || "Stream safety check failed");
            }
            if (status.stream.ready) return status;
          }
        }
        await delay(200);
      }
      throw new Error("Stream did not become ready");
    }

    function setMeter(percent) {
      const lit = Math.round((percent || 0) / 20);
      els.radioMeter.querySelectorAll("i").forEach((bar, i) => {
        bar.classList.toggle("on", i < lit);
      });
    }

    // ---------- data ----------

    async function loadChannels() {
      try {
        const res = await fetchWithFallback(
          "api/v1/sources/digital", "api/channels"
        );
        const data = await res.json();
        state.channels = Array.isArray(data) ? data : (data.items || []);
      } catch (e) {
        state.channels = [];
      }
    }

    async function loadCableChannels(refreshView) {
      try {
        const cacheKey = Date.now();
        const res = await fetchWithFallback(
          `api/v1/sources/cable?_=${cacheKey}`,
          `api/cable/channels?_=${cacheKey}`,
          { cache: "no-store" },
        );
        const data = await res.json();
        const source = data.source || data;
        state.cableChannels = data.items || data.channels || [];
        state.cableAvailable = !!source.available;
        state.cableTuner = source.tuner || null;
        if (refreshView) render();
      } catch (e) {
        // Keep the most recent channel plan across a transient API failure.
      }
    }

    async function loadSources(refreshView) {
      try {
        const cacheKey = Date.now();
        const res = await fetchWithFallback(
          `api/v1/sources?_=${cacheKey}`,
          `api/sources?_=${cacheKey}`,
          { cache: "no-store" },
        );
        const data = await res.json();
        const sources = data.sources || [];
        const cable = sources.find(source => source.id === "cable");
        if (cable) state.cableAvailable = cable.available !== false;
        // Listed catalogs (ESPN Unlimited's NHL games) show in the list, greyed:
        // nothing can tune them.
        state.roku.sources = [...sources, ...(data.listed || [])].filter(source => source.lane === "roku");
        state.roku.available = state.roku.sources.length > 0;
        if (data.lineup) state.lineup = data.lineup;
        sourcePollMs = Math.max(
          1000,
          Number((data.source && data.source.poll_interval_ms)
            || data.poll_interval_ms) || 3000,
        );
        if (refreshView) render();
      } catch (e) {
        // Keep the most recent inventory across a transient API failure.
      }
    }

    function startSourcePolling() {
      if (sourcePollTimer) clearInterval(sourcePollTimer);
      sourcePollTimer = setInterval(async () => {
        await Promise.all([loadSources(false), loadCableChannels(false)]);
        if (["tv", "roku"].includes(state.mode)) await loadRokuItems(false);
        syncRokuPolling();
        render();
      }, sourcePollMs);
    }

    async function loadStations() {
      try {
        const res = await fetch("api/fm/stations");
        const data = await res.json();
        state.stations = data.stations || [];
        state.radioAvailable = !!data.available;
        state.radioHint = data.hint;
      } catch (e) {
        state.stations = [];
      }
    }

    // ---------- rendering ----------

    function render() {
      // The panel follows the selected tab; the stage follows what is
      // actually playing, so switching tabs never hides live controls.
      const tv = state.mode === "tv";
      const antenna = state.mode === "antenna";
      const cable = state.mode === "cable";
      const radio = state.mode === "radio";
      const rokuTab = state.mode === "roku";
      els.tabTv.setAttribute("aria-selected", String(tv));
      els.tabAntenna.setAttribute("aria-selected", String(antenna));
      els.tabCable.setAttribute("aria-selected", String(cable));
      els.tabRadio.setAttribute("aria-selected", String(radio));
      els.tabRoku.setAttribute("aria-selected", String(rokuTab));
      els.tabRoku.hidden = !state.roku.available;
      // The Roku sends its own picture: there is no quality to choose.
      els.qualityGroup.classList.toggle("hidden", radio || ["roku", "vizelvision", "slides", "internet"].includes(state.playing));
      els.panelLabel.textContent = tv ? "Tunable channels" : antenna ? "Antenna Channels"
        : (cable ? "Analog Channels" : (rokuTab ? "Roku Feeds" : "Stations"));
      els.filter.placeholder = tv ? "Filter all channels…" : antenna ? "Filter antenna channels…"
        : (cable ? "Filter analog channels…"
          : (rokuTab ? "Filter Roku feeds…" : "Filter stations…"));
      els.rokuTools.hidden = !(state.roku.available && (tv || rokuTab));
      renderRokuTools();
      const manual = state.roku.lane && state.roku.lane.roku && state.roku.lane.roku.selection;
      els.rokuRemote.hidden = !(state.playing === "roku" && manual && manual.manual);

      const onRadio = state.playing === "fm";
      const onSlides = state.playing === "slides";
      els.video.classList.toggle("hidden", onRadio || onSlides);
      $("live-controls").classList.toggle("hidden", onRadio);
      $("live-controls").classList.toggle("slides", onSlides);
      els.radioStage.classList.toggle("hidden", !onRadio);
      els.slideStage.classList.toggle("hidden", !onSlides);
      // Off the stage, the slides stop: an empty frame runs nothing.
      if (!onSlides && els.slideStage.getAttribute("src")) els.slideStage.removeAttribute("src");
      els.placeholder.classList.toggle("hidden", state.playing !== null);

      if (state.playing === null) {
        els.phTitle.textContent = tv || antenna ? "No Signal"
          : (cable ? "Analog Idle" : (rokuTab ? "Roku" : "Radio Idle"));
        els.phSub.textContent = tv || antenna ? "Choose a channel to begin"
          : rokuTab ? "Choose a feed, or Manual Roku to drive it yourself"
          : (cable ? (state.cableAvailable
              ? "Choose an analog channel to begin"
              : "Analog tuner not available")
            : (state.radioAvailable ? "Choose a station to begin"
                                    : "FM tuner not enabled"));
      }

      renderList();
      renderFoot();
    }

    function matches(text) {
      return !state.filter || text.toLowerCase().includes(state.filter);
    }

    function renderList() {
      const scrollTop = els.list.scrollTop;
      const focusedKey = els.list.contains(document.activeElement)
        ? document.activeElement.dataset.channelKey : null;
      els.list.innerHTML = "";
      requestAnimationFrame(() => {
        if (focusedKey && (document.activeElement === document.body || els.list.contains(document.activeElement))) {
          const focused = [...els.list.querySelectorAll("[data-channel-key]")]
            .find(button => button.dataset.channelKey === focusedKey);
          if (focused) focused.focus({ preventScroll: true });
        }
        els.list.scrollTop = scrollTop;
      });

      if (state.mode === "radio" && !state.radioAvailable) {
        const wrap = document.createElement("div");
        wrap.className = "panel-notice";
        wrap.innerHTML =
          '<div class="notice"><strong>FM tuner not enabled.</strong><br>' +
          'The cx18 driver only creates the radio device when asked. Run ' +
          '<code>sudo modprobe -r cx18 &amp;&amp; sudo modprobe cx18 radio=1</code> ' +
          'and reload this page.</div>';
        els.list.appendChild(wrap);
        els.panelCount.textContent = "";
        return;
      }

      if (state.mode === "tv") {
        renderTunableList();
        return;
      }

      if (state.mode === "antenna") {
        renderAntennaList();
        return;
      }

      if (state.mode === "roku") {
        renderRokuList();
        return;
      }

      const items = state.mode === "cable"
        ? state.cableChannels.filter(channel =>
            matches(`rf ${channel.number} ${channel.frequency_mhz} mhz`))
        : state.stations.filter(s =>
            matches(`${s.frequency} ${s.name} ${s.format || ""}`));

      els.panelCount.textContent = String(items.length);

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = state.filter
          ? "Nothing matches that filter."
          : (state.mode === "cable" ? "Analog channel plan unavailable."
            : "No stations yet — run a scan.");
        els.list.appendChild(empty);
        return;
      }

      for (const item of items) {
        const btn = document.createElement("button");
        btn.className = "list-item";

        if (state.mode === "cable") {
          btn.setAttribute("aria-current",
                           String(item.number === state.currentCableChannel));
          btn.disabled = !state.cableAvailable;
          const displayMhz = Math.ceil(item.frequency_hz / 1e6);
          btn.innerHTML =
            `<span class="item-key">RF ${item.number}</span>` +
            `<span class="item-body"></span>` +
            `<span class="item-tag">${displayMhz} MHz</span>`;
          btn.addEventListener("click", () => tuneCable(item.number));
        } else {
          const active = state.currentFreq !== null &&
                         Math.abs(item.frequency - state.currentFreq) < 0.05;
          btn.setAttribute("aria-current", String(active));
          const sub = item.format ? escapeHtml(item.format) : "";
          const tag = item.detected
            ? `<span class="item-tag">${item.strength}%</span>` : "";
          btn.innerHTML =
            `<span class="item-key">${item.frequency.toFixed(1)}</span>` +
            `<span class="item-body"><span class="item-name">${escapeHtml(item.name)}</span>` +
            (sub ? `<span class="item-sub">${sub}</span>` : "") + `</span>` + tag;
          btn.addEventListener("click", () => tuneFm(item.frequency));
        }
        els.list.appendChild(btn);
      }
    }

    function tunableChannels() {
      return TunableChannels.catalog(state.channels, state.roku.sources,
                                     state.roku.items, state.roku.date, state.lineup);
    }

    // A lineup-card heading; a games section says which day it lists.
    function sectionHeading(name) {
      const sections = (state.lineup && state.lineup.sections) || [];
      const games = sections.some(section => section.name === name && section.games);
      const header = document.createElement("div");
      header.className = "list-section";
      header.textContent = games && state.roku.date ? `${name} · ${state.roku.date}` : name;
      return header;
    }

    function renderTunableList() {
      const items = tunableChannels().filter(item => matches(item.search));
      els.panelCount.textContent = String(items.length);
      const roku = (state.roku.lane && state.roku.lane.roku) || {};
      const selection = roku.selection || {};
      const operation = roku.operation || {};
      rokuListKey = [state.playing, selection.source_id, selection.channel_id, selection.date,
                    operation.active && operation.target && operation.target.channel_id].join("|");
      let section = null;
      for (const entry of items) {
        if (entry.section && entry.section !== section) els.list.appendChild(sectionHeading(entry.section));
        section = entry.section;
        const button = document.createElement("button");
        button.className = "list-item";
        button.dataset.channelKey = entry.id;
        const numbered = entry.number !== null;
        let key = numbered ? String(entry.number) : "", sub = "", tag = entry.tag, current = false, progress = "";
        if (entry.kind === "digital") {
          current = state.playing === "tv" && state.currentChannelId === entry.channel.id;
          // The antenna's own number rides in the tag, as the Antenna tab lists it.
          if (!numbered) { key = entry.channel.number; tag = "ATSC"; }
          const on = listingFor(entry.channel.number, Date.now() / 1000).now;
          sub = on ? on.title || "No title" : `Antenna · RF ${entry.channel.rf_channel}`;
          if (on) progress = `<span class="item-bar"><i style="width:${progressOf(on, Date.now() / 1000).toFixed(0)}%"></i></span>`;
          button.addEventListener("click", () => tuneTv(entry.channel.id));
        } else if (entry.kind === "roku") {
          const { source, item } = entry;
          current = state.playing === "roku" && selection.source_id === source.id
            && selection.channel_id === item.id && (!source.dated || selection.date === state.roku.date);
          const clock = source.dated ? gameClock(item) : "";
          if (!numbered) key = clock || rokuShortName(source.id);
          else if (clock) tag = clock;
          // A YouTube TV channel shows what is on, as an antenna channel does.
          const on = source.dated ? null : listingFor(`${source.id}/${item.id}`, Date.now() / 1000).now;
          sub = on ? on.title || "No title"
            : [source.name, source.dated ? item.status : item.note].filter(Boolean).join(" · ");
          if (on) progress = `<span class="item-bar"><i style="width:${progressOf(on, Date.now() / 1000).toFixed(0)}%"></i></span>`;
          if (operation.active && operation.target && operation.target.source_id === source.id
              && operation.target.channel_id === item.id) tag = "MOVING";
          button.disabled = source.available === false || item.playable === false;
          if (item.playable === false && item.note) button.title = item.note;
          button.addEventListener("click", () => tuneRoku(source, item));
        } else if (entry.kind === "internet") {
          current = state.playing === "internet" && state.internet && state.internet.id === entry.id;
          if (!numbered) key = "WEB";
          sub = entry.sub;
          button.addEventListener("click", () => tuneInternet(entry));
        } else if (entry.kind === "slides") {
          current = state.playing === "slides" && state.slide && state.slide.id === entry.id;
          if (!numbered) key = "SG";
          sub = entry.sub;
          button.addEventListener("click", () => tuneSlides(entry));
        } else {
          current = state.playing === "vizelvision" && state.houseNumber === entry.number;
          if (!numbered) key = "VV";
          sub = "The station’s live broadcast";
          button.addEventListener("click", () => tuneVizelVision(entry.number));
        }
        button.setAttribute("aria-current", String(current));
        button.innerHTML = `<span class="item-key">${escapeHtml(key)}</span>` +
          `<span class="item-body"><span class="item-name">${escapeHtml(entry.name)}</span>` +
          `<span class="item-sub">${escapeHtml(sub)}</span>${progress}</span>` +
          `<span class="item-tag">${escapeHtml(tag)}</span>`;
        els.list.appendChild(button);
      }
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Nothing matches that filter.";
        els.list.appendChild(empty);
      }
    }

    // The antenna channels by their own numbers, as a TV lists them after a
    // scan: primaries first, then each station's subchannels, with the RF.
    function renderAntennaList() {
      const items = state.channels.filter(channel => matches(
        `${channel.number} ${channel.name} rf ${channel.rf_channel} ch ${channel.tv_number ?? ""}`));
      els.panelCount.textContent = String(items.length);
      const now = Date.now() / 1000;
      for (const channel of items) {
        const button = document.createElement("button");
        button.className = "list-item";
        button.dataset.channelKey = `antenna:${channel.id}`;
        button.setAttribute("aria-current",
                            String(state.playing === "tv" && state.currentChannelId === channel.id));
        const on = listingFor(channel.number, now).now;
        const sub = [Number.isInteger(channel.tv_number) ? `Ch ${channel.tv_number}` : "",
                     on ? on.title || "No title" : ""].filter(Boolean).join(" · ");
        const progress = on
          ? `<span class="item-bar"><i style="width:${progressOf(on, now).toFixed(0)}%"></i></span>` : "";
        button.innerHTML = `<span class="item-key">${escapeHtml(channel.number)}</span>` +
          `<span class="item-body"><span class="item-name">${escapeHtml(channel.name)}</span>` +
          (sub ? `<span class="item-sub">${escapeHtml(sub)}</span>` : "") + `${progress}</span>` +
          `<span class="item-tag">RF ${escapeHtml(channel.rf_channel)}</span>`;
        button.addEventListener("click", () => tuneTv(channel.id));
        els.list.appendChild(button);
      }
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = state.filter ? "Nothing matches that filter." : "No channels yet — run a scan.";
        els.list.appendChild(empty);
      }
    }

    // The tune message's "Channel 4 · antenna 4.1"; the antenna number alone
    // when the lineup has not numbered it.
    function digitalLabel(channel) {
      const known = state.channels.find(c => c.id === channel.id) || channel;
      return Number.isInteger(known.tv_number)
        ? `Channel ${known.tv_number} · antenna ${known.number}` : `Channel ${known.number}`;
    }

    function tuneVizelVision(number) {
      state.houseNumber = Number.isInteger(number) ? number : null;
      watchRelay("vizelvision", "stream/vizelvision/index.m3u8", "VizelVision",
                 "Connecting to the live broadcast…", "Live broadcast");
    }

    // An internet stream plays the server's relay of it, like VizelVision.
    function tuneInternet(entry) {
      state.internet = entry;
      watchRelay("internet", entry.streamPath.replace(/^\//, ""), entry.name,
                 "Connecting to the stream…", entry.sub || "Internet stream");
    }

    // A watch-only stream the server relays: no tuner, no lock, no encoder.
    function watchRelay(playing, path, title, connecting, live) {
      const serial = ++state.tuneSerial;
      state.tuning = false;
      state.needsReconnect = false;
      state.currentChannelId = null;
      state.currentCableChannel = null;
      state.currentFreq = null;
      state.streamId = null;
      stopSignalPolling();
      els.radioAudio.pause();
      els.radioAudio.removeAttribute("src");
      destroyHls();
      els.video.pause();
      els.video.removeAttribute("src");
      els.video.load();
      state.playing = playing;
      render();
      syncRokuPolling();
      showLock(null);
      setStatus(title, "busy");
      setNowPlaying(title, connecting);
      attachStream(path, els.video, () => {
        if (serial !== state.tuneSerial) return;
        setStatus(`${title} unavailable`, "error");
        setNowPlaying(title, "Stream unavailable · choose the channel to retry");
      }, () => {
        if (serial !== state.tuneSerial) return;
        setStatus(title, "live");
        setNowPlaying(title, live);
      });
    }

    // A slide channel plays in the browser, from the station's page for it:
    // no tuner, no stream, no lock.
    function tuneSlides(entry) {
      ++state.tuneSerial;
      state.slide = entry;
      state.tuning = false;
      state.needsReconnect = false;
      state.currentChannelId = null;
      state.currentCableChannel = null;
      state.currentFreq = null;
      state.streamId = null;
      stopSignalPolling();
      els.radioAudio.pause();
      els.radioAudio.removeAttribute("src");
      destroyHls();
      els.video.pause();
      els.video.removeAttribute("src");
      els.video.load();
      state.playing = "slides";
      if (els.slideStage.getAttribute("src") !== entry.page) els.slideStage.setAttribute("src", entry.page);
      render();
      syncRokuPolling();
      showLock(null);
      setStatus(entry.name, "live");
      setNowPlaying(entry.name, entry.sub);
    }

    function renderFoot() {
      if (state.mode === "roku") {
        const lane = state.roku.lane;
        els.footLeft.textContent = lane && lane.stream && lane.stream.active
          ? "Capture running" : "Capture stopped";
        els.footRight.textContent = "HD PVR · H.264 copy";
        return;
      }
      if (state.mode === "tv") {
        els.footLeft.textContent = `${tunableChannels().length} channels`;
        els.footRight.textContent = "ATSC · Roku · VizelVision · Internet";
      } else if (state.mode === "antenna") {
        els.footLeft.textContent = `${state.channels.length} channels`;
        els.footRight.textContent = "ATSC · antenna numbers";
      } else if (state.mode === "cable") {
        els.footLeft.textContent = `${state.cableChannels.length} channels`;
        els.footRight.textContent = state.cableAvailable
          ? "NTSC-M · frequency order"
          : "Analog tuner unavailable";
      } else {
        els.footLeft.textContent = `${state.stations.length} stations`;
        els.footRight.textContent = "FM · 87.9–107.9";
      }
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }

    function apiErrorMessage(data, fallback) {
      if (!data || !data.error) return fallback;
      return typeof data.error === "string"
        ? data.error
        : (data.error.message || fallback);
    }

    // ---------- tuning ----------

    // ---------- Tuner locks ----------
    //
    // A lock is another service's deliberate claim on the front-end.
    // Overriding one is always a person's decision, taken in front of the
    // details of what is being broken -- the page never retries past a 423
    // on its own.

    function lockSummary(lock) {
      const minutes = Math.max(1, Math.round(lock.seconds_remaining / 60));
      const playing = lock.program && lock.program.title
        ? ` while “${lock.program.title}” is on` : "";
      return `${lock.owner} holds the ${lock.lane} tuner${playing}, `
           + `about ${minutes} minute${minutes === 1 ? "" : "s"} left`;
    }

    let overrideResolve = null;

    function confirmOverride(lock, action) {
      els.ovrTitle.textContent = `Override ${lock.owner}'s lock?`;
      els.ovrBody.textContent =
        `${lockSummary(lock)}.`
        + (lock.reason ? ` It was taken for: ${lock.reason}.` : "")
        + ` You are about to ${action}.`;
      els.ovrNote.textContent = lock.until === "program_end"
        ? "The lock was set to last until that programme ends. Overriding it "
          + "interrupts whatever that service is doing, and cannot be undone "
          + "from here."
        : "Overriding interrupts whatever that service is doing, and cannot "
          + "be undone from here.";
      els.overrideModal.hidden = false;
      // The safe choice takes focus, so a stray Enter does not break a lock.
      els.ovrCancel.focus();
      return new Promise(resolve => { overrideResolve = resolve; });
    }

    function closeOverride(result) {
      els.overrideModal.hidden = true;
      if (overrideResolve) { overrideResolve(result); overrideResolve = null; }
    }

    els.ovrCancel.addEventListener("click", () => closeOverride(false));
    els.ovrConfirm.addEventListener("click", () => closeOverride(true));
    els.overrideModal.addEventListener("click", (event) => {
      if (event.target === els.overrideModal) closeOverride(false);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !els.overrideModal.hidden) {
        closeOverride(false);
      }
    });

    function showLock(lock) {
      // Our own Roku lock is shown beside the remote, not as a warning.
      if (lock && lock.lane === "roku" && state.roku.lock) lock = null;
      state.lock = lock || null;
      if (!lock) { els.lockPill.hidden = true; return; }
      const minutes = Math.max(1, Math.round(lock.seconds_remaining / 60));
      els.lockPill.hidden = false;
      els.lockPill.textContent = `🔒 ${lock.owner} · ${minutes}m`;
      els.lockPill.title = `${lockSummary(lock)}. Click to release it.`;
    }

    els.lockPill.addEventListener("click", async () => {
      const lock = state.lock;
      if (!lock) return;
      if (!await confirmOverride(lock, "release this lock")) return;
      const res = await fetchWithFallback(
        "api/v1/tuner/lock/release", "api/tuner/lock/release", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lane: lock.lane, override: true }),
        });
      if (res.ok) { showLock(null); return; }
      const data = await res.json().catch(() => ({}));
      setStatus(apiErrorMessage(data, "Could not release the lock"), "error");
    });

    async function pollLock() {
      try {
        const res = await fetchWithFallback(
          "api/v1/tuner/lock", "api/tuner/lock", { cache: "no-store" });
        if (!res.ok) return;
        const locks = (await res.json()).locks || {};
        state.locks = locks;
        if (state.roku.lock && (!locks.roku || locks.roku.owner !== ROKU_OWNER)) {
          forgetRokuLock();  // Expired, released elsewhere, or overridden.
        }
        showLock(["vizelvision", "slides", "internet"].includes(state.playing) ? null : state.mode === "roku" || state.playing === "roku"
          ? locks.roku || null : locks.digital || locks.analog || null);
        renderRokuTools();
      } catch (error) {
        // A missed poll is not worth surfacing; the next one is 15s away,
        // and any tune against a live lock is refused on the server anyway.
      }
    }

    pollLock();
    setInterval(pollLock, 15000);

    // Follow external retunes and encoder recovery without issuing a tune.
    let streamPollBusy = false;
    async function pollStream() {
      if (streamPollBusy || state.tuning || !["tv", "cable", "roku"].includes(state.playing)) return;
      streamPollBusy = true;
      const serial = state.tuneSerial;
      const playing = state.playing;
      try {
        const response = await fetch("api/v1/status", { cache: "no-store" });
        if (!response.ok || state.tuning || serial !== state.tuneSerial || playing !== state.playing) return;
        const data = await response.json();
        if (state.tuning || serial !== state.tuneSerial || playing !== state.playing) return;
        const lane = data.lanes && data.lanes[
          playing === "cable" ? "analog" : (playing === "roku" ? "roku" : "digital")];
        if (!lane) return;
        if (playing === "roku") {
          state.roku.lane = lane;
          renderRokuState();
        }
        if (lane.stream.state === "failed") {
          liveMessage.textContent = lane.stream.error?.message || "Stream unavailable";
          return;
        }
        if (!lane.stream.ready || (lane.stream.id === state.streamId && !state.needsReconnect)) return;
        state.streamId = lane.stream.id;
        if (playing !== "roku") state.quality = lane.quality;
        const selection = lane.selection || {};
        state.currentChannelId = playing === "tv" ? selection.id : null;
        state.currentCableChannel = playing === "cable" ? selection.channel : null;
        const title = playing === "cable" ? `Cable ${selection.channel}`
          : (playing === "roku" ? rokuTitle(lane) : selection.name);
        destroyHls();
        els.video.pause();
        els.video.removeAttribute("src");
        els.video.load();
        render();
        setStatus(title, "busy");
        setNowPlaying(title, "Buffering…");
        const generation = state.streamId;
        startTvPlayback(generation, 0, () => {
          if (serial !== state.tuneSerial || generation !== state.streamId) return;
          setStatus(title, "live");
          setNowPlaying(title, playing === "roku" ? "Roku · HD PVR" : lane.quality);
        });
      } catch (_) {
        // A brief failed status request must not interrupt healthy playback.
      } finally { streamPollBusy = false; }
    }
    setInterval(pollStream, 2000);

    async function tuneTv(channelId) {
      const tuneSerial = ++state.tuneSerial;
      const ch = state.channels.find(c => c.id === channelId);
      state.currentChannelId = channelId;
      state.currentCableChannel = null;
      state.currentFreq = null;
      stopSignalPolling();
      render();

      setStatus("Tuning…", "busy");
      setNowPlaying(ch ? ch.name : "…", "Acquiring signal");
      // Freeze the last decoded frame while the server creates a new encoder
      // generation. Continuing to load the old playlist would expose its
      // player to a reset media sequence before the new manifest is ready.
      if (hls) hls.stopLoad();
      cancelStartup();
      $("live-play").disabled = true;
      $("live-edge").disabled = true;
      els.video.pause();
      liveMessage.textContent = "Tuning…";
      state.needsReconnect = true;

      state.tuning = true;
      try {
        const body = {
          source: "digital",
          channel_id: channelId,
          quality: state.quality,
        };
        const post = (extra) => fetchWithFallback(
          "api/v1/tune", "api/tune", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...body, ...extra }),
          });

        let res = await post({});
        let data = await res.json();
        if (tuneSerial !== state.tuneSerial) return;

        if (res.status === 423 && data.lock) {
          showLock(data.lock);
          const label = ch ? `tune to ${ch.name}` : "retune this tuner";
          if (!await confirmOverride(data.lock, label)) {
            setStatus("Tuner locked", "error");
            setNowPlaying("Nothing playing", lockSummary(data.lock));
            return;
          }
          if (tuneSerial !== state.tuneSerial) return;
          res = await post({ override: true });
          data = await res.json();
          if (tuneSerial !== state.tuneSerial) return;
          if (res.ok) showLock(null);
        }

        if (!res.ok || !data.ok) {
          const message = apiErrorMessage(data, "Tune failed");
          setStatus(message, "error");
          setNowPlaying("Nothing playing", message);
          return;
        }
        const tuned = data.selection || data.channel || ch;
        // A locked tuner is watched at the quality its holder chose.
        if (data.quality) showQuality(data.quality);
        state.playing = "tv";
        state.streamId = (data.stream && data.stream.id) || data.stream_id;
        if (!state.streamId) throw new Error("Server returned no stream ID");
        render();
        setStatus(tuned.name, "busy");
        setNowPlaying(tuned.name, `${digitalLabel(tuned)} · buffering`);

        // Do not hand hls.js a manifest URL until the matching generation has
        // published one. A fatal 404 on the initial manifest load cannot be
        // repaired reliably with startLoad().
        await waitForTvStream(state.streamId);
        if (tuneSerial !== state.tuneSerial) return;
        destroyHls();
        els.video.removeAttribute("src");
        els.video.load();
        startTvPlayback(state.streamId, 0, () => {
          if (tuneSerial !== state.tuneSerial) return;
          setStatus(tuned.name, "live");
          setNowPlaying(tuned.name,
                        `${digitalLabel(tuned)} · ${state.quality}`);
        });
      } catch (e) {
        if (tuneSerial !== state.tuneSerial) return;
        setStatus("Failed to tune", "error");
        setNowPlaying(ch ? ch.name : "Nothing playing", e.message || "Tune failed");
      } finally {
        if (tuneSerial === state.tuneSerial) state.tuning = false;
      }
    }

    async function tuneCable(channelNumber) {
      const tuneSerial = ++state.tuneSerial;
      const channel = state.cableChannels.find(
        item => item.number === channelNumber
      );
      if (!channel || !state.cableAvailable) {
        setStatus("Analog cable tuner unavailable", "error");
        return;
      }

      state.currentCableChannel = channelNumber;
