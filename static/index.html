      state.currentChannelId = null;
      state.currentFreq = null;
      stopSignalPolling();
      render();
      setStatus("Tuning…", "busy");
      setNowPlaying(`Cable ${channelNumber}`, "Acquiring signal");
      if (hls) hls.stopLoad();
      cancelStartup();
      $("live-play").disabled = true;
      $("live-edge").disabled = true;
      els.video.pause();
      liveMessage.textContent = "Tuning…";
      state.needsReconnect = true;

      state.tuning = true;
      try {
        const res = await fetchWithFallback(
          "api/v1/tune", "api/cable/tune", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            source: "cable",
            channel: channelNumber,
            quality: state.quality,
          }),
          },
        );
        const data = await res.json();
        if (tuneSerial !== state.tuneSerial) return;
        if (!res.ok || !data.ok) {
          const message = apiErrorMessage(data, "Cable tune failed");
          setStatus(message, "error");
          setNowPlaying("Nothing playing", message);
          return;
        }

        const tuned = data.selection || {
          channel: data.channel || channelNumber,
          frequency_hz: data.frequency_hz || channel.frequency_hz,
        };
        const displayMhz = Math.ceil(tuned.frequency_hz / 1e6);
        if (data.quality) showQuality(data.quality);
        state.playing = "cable";
        state.streamId = (data.stream && data.stream.id) || data.stream_id;
        if (!state.streamId) throw new Error("Server returned no stream ID");
        render();
        setStatus(`Cable ${tuned.channel}`, "busy");
        setNowPlaying(`Cable ${tuned.channel}`, `${displayMhz} MHz · buffering`);
        await waitForTvStream(state.streamId);
        if (tuneSerial !== state.tuneSerial) return;
        destroyHls();
        els.video.removeAttribute("src");
        els.video.load();
        startTvPlayback(state.streamId, 0, () => {
          if (tuneSerial !== state.tuneSerial) return;
          setStatus(`Cable ${tuned.channel}`, "live");
          setNowPlaying(
            `Cable ${tuned.channel}`,
            `${displayMhz} MHz · ${state.quality}`,
          );
        });
      } catch (e) {
        if (tuneSerial !== state.tuneSerial) return;
        setStatus("Cable tune failed", "error");
        setNowPlaying(
          `Cable ${channelNumber}`,
          e.message || "Cable tune failed",
        );
      } finally {
        if (tuneSerial === state.tuneSerial) state.tuning = false;
      }
    }

    // Playback retries re-attach to the existing stream; they never re-issue
    // a tune, which would restart the encoder and take the tuner down again.
    function startTvPlayback(streamId, attempt, onReady) {
      attempt = attempt || 0;
      streamId = streamId || state.streamId || String(Date.now());
      if (streamId !== state.streamId || !["tv", "cable", "roku"].includes(state.playing)) return;
      state.needsReconnect = false;
      const playlist = state.playing === "cable" ? "analog"
        : (state.playing === "roku" ? "roku" : "digital");
      attachStream(`stream/${playlist}.m3u8?v=${encodeURIComponent(streamId)}`, els.video, () => {
        if (streamId !== state.streamId) return;
        if (attempt < 5) {
          setTimeout(() => startTvPlayback(streamId, attempt + 1, onReady), 1000);
        }
        else setStatus("Stream unavailable", "error");
      }, onReady);
    }

    function startFmPlayback(attempt) {
      attempt = attempt || 0;
      attachStream("stream/radio.m3u8", els.radioAudio, () => {
        if (attempt < 5) setTimeout(() => startFmPlayback(attempt + 1), 3000);
        else setStatus("Stream unavailable", "error");
      });
    }

    async function tuneFm(freq) {
      freq = Math.round(freq * 10) / 10;
      if (freq < FM_MIN || freq > FM_MAX) return;
      if (!state.radioAvailable) {
        setStatus("FM tuner not enabled", "error");
        return;
      }

      state.currentFreq = freq;
      state.currentChannelId = null;
      state.currentCableChannel = null;
      const known = state.stations.find(s => Math.abs(s.frequency - freq) < 0.05);

      els.radioFreq.textContent = freq.toFixed(1);
      els.radioName.textContent = known ? known.name : "Unlisted";
      els.radioFormat.textContent = known && known.format ? known.format : "";
      els.radioStereo.textContent = "MONO";
      setMeter(0);
      stopSignalPolling();
      state.playing = "fm";
      render();

      setStatus(`Tuning ${freq.toFixed(1)} MHz…`, "busy");
      setNowPlaying(known ? known.name : `${freq.toFixed(1)} FM`, "Acquiring signal");

      try {
        const res = await fetch("api/fm/tune", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ frequency: freq }),
        });
        const data = await res.json();
        if (!data.ok) {
          state.playing = null;
          render();
          setStatus(data.error || "FM tune failed", "error");
          setNowPlaying("Nothing playing", "FM tune failed");
          return;
        }
        setTimeout(() => {
          if (state.currentFreq !== freq) return;  // superseded
          startFmPlayback();
          setStatus(`${freq.toFixed(1)} MHz`, "live");
          setNowPlaying(known ? known.name : `${freq.toFixed(1)} FM`,
                        `${freq.toFixed(1)} MHz · FM`);
          startSignalPolling();
        }, 4000);
      } catch (e) {
        setStatus("Failed to tune", "error");
      }
    }

    // Stepping updates the readout at once but debounces the retune, so
    // holding an arrow key doesn't restart the encoder on every step.
    function stepFrequency(direction) {
      const base = state.currentFreq === null ? FM_MIN : state.currentFreq;
      let next = Math.round((base + direction * FM_STEP) * 10) / 10;
      if (next > FM_MAX) next = FM_MIN;
      if (next < FM_MIN) next = FM_MAX;

      state.currentFreq = next;
      els.radioFreq.textContent = next.toFixed(1);
      const known = state.stations.find(s => Math.abs(s.frequency - next) < 0.05);
      els.radioName.textContent = known ? known.name : "Unlisted";
      els.radioFormat.textContent = known && known.format ? known.format : "";

      if (stepTimer) clearTimeout(stepTimer);
      stepTimer = setTimeout(() => { stepTimer = null; tuneFm(next); }, 600);
    }

    // ---------- signal polling ----------

    function startSignalPolling() {
      stopSignalPolling();
      signalTimer = setInterval(async () => {
        try {
          const res = await fetch("api/fm/status");
          const fm = await res.json();
          if (!fm.playing) { stopSignalPolling(); return; }
          setMeter(fm.signal);
          els.radioStereo.textContent = fm.stereo ? "STEREO" : "MONO";
        } catch (e) { /* transient */ }
      }, 3000);
    }

    function stopSignalPolling() {
      if (signalTimer) { clearInterval(signalTimer); signalTimer = null; }
    }

    // ---------- Roku ----------
    //
    // The Roku lane is the source Roku through the HD PVR. A feed navigates
    // the Roku -- a minute or two for YouTube TV -- and the picture keeps
    // playing meanwhile, menus and all. Manual Roku hands it to the remote.
    // Locking the Roku keeps everyone else, vizelVision included, from
    // moving it until you release it or the hour runs out.

    const ROKU_OWNER = "Web remote";
    const ROKU_LOCK_KEY = "tvthing.rokuLock";
    const ROKU_SHORT = {
      "youtube-tv": "YTTV", "mlb": "MLB", "thursday-night-football": "TNF",
      "sunday-ticket": "NFL", "nhl": "NHL", "roku-manual": "RK",
    };
    let rokuPollTimer = null;
    let rokuListKey = null;
    let rokuItemsAt = 0;
    let rokuAppsLoaded = false;

    try {
      const saved = JSON.parse(sessionStorage.getItem(ROKU_LOCK_KEY) || "null");
      if (saved && saved.token && saved.expires_at * 1000 > Date.now()) state.roku.lock = saved;
    } catch (_) { /* Storage can be unavailable; the lock simply is not remembered. */ }

    function rememberRokuLock(token, expiresAt) {
      state.roku.lock = { token, expires_at: expiresAt };
      try { sessionStorage.setItem(ROKU_LOCK_KEY, JSON.stringify(state.roku.lock)); } catch (_) {}
    }

    function forgetRokuLock() {
      state.roku.lock = null;
      try { sessionStorage.removeItem(ROKU_LOCK_KEY); } catch (_) {}
    }

    function rokuToken() {
      const lock = state.roku.lock;
      return lock && lock.expires_at * 1000 > Date.now() ? lock.token : undefined;
    }

    function rokuShortName(sourceId) { return ROKU_SHORT[sourceId] || "RK"; }

    function rokuItem(target) {
      if (!target) return null;
      return (state.roku.items[target.source_id] || []).find(item => item.id === target.channel_id) || null;
    }

    function rokuTargetName(target) {
      if (!target) return "…";
      const item = rokuItem(target);
      return item ? item.name : target.channel_id;
    }

    function rokuTitle(lane) {
      const roku = (lane && lane.roku) || {};
      if (roku.operation && roku.operation.active) return `Roku · ${rokuTargetName(roku.operation.target)}`;
      if (roku.selection && roku.selection.manual) return "Manual Roku";
      if (roku.selection) return roku.selection.name || roku.selection.channel_id;
      return "Roku";
    }

    function ago(seconds) {
      if (seconds == null) return "earlier";
      if (seconds < 90) return "just now";
      const minutes = Math.round(seconds / 60);
      return minutes < 90 ? `${minutes} minutes ago` : `${Math.round(minutes / 60)} hours ago`;
    }

    function localDate() {
      const now = new Date();
      const pad = n => String(n).padStart(2, "0");
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    }

    function gameClock(item) {
      if (item.state === "live" || item.state === "in") return "LIVE";
      if (item.state === "final" || item.state === "post") return "FINAL";
      if (!item.start_time) return "";
      return new Date(item.start_time).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function renderRokuTools() {
      if (els.rokuTools.hidden) return;
      const held = state.locks && state.locks.roku;
      const minutes = held ? Math.max(1, Math.round(held.seconds_remaining / 60)) : 0;
      const mine = !!(state.roku.lock && held && held.owner === ROKU_OWNER);
      els.rokuLockText.classList.toggle("mine", mine);
      if (mine) {
        els.rokuLockText.textContent = `You hold the Roku · ${minutes}m left`;
        els.rokuLock.textContent = "Release";
      } else if (held) {
        els.rokuLockText.textContent = `${held.owner} holds the Roku · ${minutes}m`;
        els.rokuLock.textContent = "Take over";
      } else {
        els.rokuLockText.textContent = "Unlocked: anyone can change it";
        els.rokuLock.textContent = "Lock Roku";
      }
      if (!state.roku.date) state.roku.date = localDate();
      if (document.activeElement !== els.rokuDate) els.rokuDate.value = state.roku.date;
      const operation = state.roku.lane && state.roku.lane.roku && state.roku.lane.roku.operation;
      els.rokuStop.hidden = !(operation && operation.active);
    }

    function renderRokuState() {
      const roku = (state.roku.lane && state.roku.lane.roku) || {};
      const manual = !!(roku.selection && roku.selection.manual);
      els.rokuRemote.hidden = !(state.playing === "roku" && manual);
      if (manual && !rokuAppsLoaded) loadRokuApps();
      renderRokuTools();
      if (state.mode === "roku") renderFoot();
      if (state.playing === "roku") renderBanner();
      // Re-render the list only when what it highlights changes, so a poll
      // never steals keyboard focus or scrolls it.
      const selection = roku.selection || {};
      const operation = roku.operation || {};
      const key = [state.playing, selection.source_id, selection.channel_id, selection.date,
                   operation.active && operation.target && operation.target.channel_id].join("|");
      if (["tv", "roku"].includes(state.mode) && key !== rokuListKey) renderList();
    }

    function renderRokuList() {
      const roku = (state.roku.lane && state.roku.lane.roku) || {};
      const selection = roku.selection;
      const operation = roku.operation;
      rokuListKey = [state.playing, selection && selection.source_id, selection && selection.channel_id,
                     selection && selection.date,
                     operation && operation.active && operation.target && operation.target.channel_id].join("|");
      let total = 0;
      for (const source of state.roku.sources) {
        const items = (state.roku.items[source.id] || []).filter(item =>
          matches(`${source.name} ${item.name} ${(item.aliases || []).join(" ")}`));
        if (!items.length && (state.filter || !source.dated)) continue;
        const header = document.createElement("div");
        header.className = "list-section";
        header.textContent = source.dated ? `${source.name} · ${state.roku.date}` : source.name;
        els.list.appendChild(header);
        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "Nothing on this day.";
          els.list.appendChild(empty);
          continue;
        }
        for (const item of items) {
          total += 1;
          const btn = document.createElement("button");
          btn.className = "list-item";
          const current = !!(state.playing === "roku" && selection && selection.source_id === source.id
            && selection.channel_id === item.id
            && (!source.dated || selection.date === state.roku.date));
          const moving = !!(operation && operation.active && operation.target
            && operation.target.source_id === source.id && operation.target.channel_id === item.id);
          btn.setAttribute("aria-current", String(current));
          let key = rokuShortName(source.id), sub = "", tag = moving ? "MOVING" : "";
          if (source.dated) {
            key = gameClock(item) || key;
            const route = item.route && item.route.label;
            sub = [item.status, route].filter(Boolean).join(" · ");
            btn.disabled = item.playable === false;
            if (item.playable === false && item.note) btn.title = item.note;
          } else if (source.id === "youtube-tv") {
            sub = (item.aliases || []).join(" · ");
          } else {
            sub = item.note || "";
          }
          btn.innerHTML =
            `<span class="item-key">${escapeHtml(key)}</span>` +
            `<span class="item-body"><span class="item-name">${escapeHtml(item.name)}</span>` +
            (sub ? `<span class="item-sub">${escapeHtml(sub)}</span>` : "") + `</span>` +
            (tag ? `<span class="item-tag">${tag}</span>` : "");
          btn.addEventListener("click", () => tuneRoku(source, item));
          els.list.appendChild(btn);
        }
      }
      els.panelCount.textContent = String(total);
      if (!state.roku.sources.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "The Roku lane is not configured.";
        els.list.appendChild(empty);
      }
    }

    async function loadRokuItems(force) {
      if (!force && Date.now() - rokuItemsAt < 60000) return;
      rokuItemsAt = Date.now();
      if (!state.roku.date) state.roku.date = localDate();
      await Promise.all(state.roku.sources.map(async source => {
        const query = source.dated ? `?date=${encodeURIComponent(state.roku.date)}` : "";
        try {
          const res = await fetch(`api/v1/sources/${source.id}${query}`, { cache: "no-store" });
          const data = await res.json();
          state.roku.items[source.id] = res.ok ? (data.items || []) : [];
        } catch (_) {
          // Keep what was listed; a schedule outage is not worth an alarm.
        }
      }));
      if (["tv", "roku"].includes(state.mode)) { renderList(); renderFoot(); }
    }

    async function loadRokuApps() {
      rokuAppsLoaded = true;
      try {
        const res = await fetch("api/v1/roku/apps", { cache: "no-store" });
        const data = await res.json();
        if (!res.ok) { rokuAppsLoaded = false; return; }
        els.rokuApps.innerHTML = '<option value="">Launch an app…</option>' +
          (data.apps || []).map(app =>
            `<option value="${escapeHtml(app.id)}">${escapeHtml(app.name)}</option>`).join("");
      } catch (_) { rokuAppsLoaded = false; }
    }

    async function rokuPost(path, body, action) {
      const send = extra => fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...body, token: rokuToken(), ...extra }),
      });
      let res = await send({});
      let data = await res.json().catch(() => ({}));
      if (res.status === 423 && data.lock) {
        showLock(data.lock);
        if (!await confirmOverride(data.lock, action)) return { res, data, declined: true };
        res = await send({ override: true });
        data = await res.json().catch(() => ({}));
        if (res.ok) showLock(null);
      }
      return { res, data, declined: false };
    }

    async function pollRoku() {
      try {
        const res = await fetch("api/v1/status", { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        state.roku.lane = data.lanes && data.lanes.roku;
        state.locks = data.locks || state.locks;
        renderRokuState();
        if (state.playing === "roku" && !state.tuning) {
          const lane = state.roku.lane || {};
          const operation = lane.roku && lane.roku.operation;
          const title = rokuTitle(lane);
          if (operation && operation.active) {
            setStatus(title, "busy");
            setNowPlaying(title, operation.message || "Navigating…");
          } else if (operation && operation.state === "failed" && !lane.selection) {
            setStatus(operation.message || "The Roku could not find it", "error");
            setNowPlaying(title, "Navigation failed");
          } else if (lane.stream && lane.stream.ready) {
            setStatus(title, "live");
            setNowPlaying(title, "Roku · HD PVR");
          }
        }
      } catch (_) {
        // The next poll is a moment away.
      }
    }

    function syncRokuPolling() {
      const wanted = state.roku.available && (["tv", "roku"].includes(state.mode) || state.playing === "roku");
      if (wanted && !rokuPollTimer) {
        pollRoku();
        rokuPollTimer = setInterval(pollRoku, 1500);
      } else if (!wanted && rokuPollTimer) {
        clearInterval(rokuPollTimer);
        rokuPollTimer = null;
      }
    }

    async function watchRoku(streamId, tuneSerial) {
      if (tuneSerial !== state.tuneSerial) return;
      // The Roku's capture runs continuously; attach once per generation.
      if (state.playing === "roku" && state.streamId === streamId && hls) return;
      state.playing = "roku";
      state.streamId = streamId;
      render();
      syncRokuPolling();
      await waitForTvStream(streamId);
      if (tuneSerial !== state.tuneSerial) return;
      destroyHls();
      els.video.removeAttribute("src");
      els.video.load();
      startTvPlayback(streamId, 0, () => {
        if (tuneSerial !== state.tuneSerial) return;
        const title = rokuTitle(state.roku.lane);
        setStatus(title, "live");
        setNowPlaying(title, "Roku · HD PVR");
      });
    }

    async function tuneRoku(source, item) {
      const tuneSerial = ++state.tuneSerial;
      state.currentChannelId = null;
      state.currentCableChannel = null;
      state.currentFreq = null;
      const manual = source.id === "roku-manual";
      setStatus(manual ? "Manual Roku" : `Finding ${item.name}…`, "busy");
      state.tuning = true;
      try {
        const body = { source: source.id, channel_id: item.id };
        if (source.dated) body.date = state.roku.date;
        const { res, data, declined } = await rokuPost("api/v1/tune", body, `put ${item.name} on the Roku`);
        if (tuneSerial !== state.tuneSerial) return;
        if (declined) {
          setStatus("Roku locked", "error");
          return;
        }
        if (!res.ok || !data.ok) {
          const message = apiErrorMessage(data, "The Roku would not change");
          setStatus(message, "error");
          setNowPlaying(item.name, message);
          return;
        }
        state.tuning = false;
        await pollRoku();
        if (!data.stream || !data.stream.id) throw new Error("The Roku capture is not running");
        setNowPlaying(rokuTitle(state.roku.lane),
                      data.reused ? "Already on the Roku" : (manual ? "Use the remote" : "Navigating…"));
        await watchRoku(data.stream.id, tuneSerial);
      } catch (e) {
        if (tuneSerial !== state.tuneSerial) return;
        setStatus("The Roku would not change", "error");
        setNowPlaying(item.name, e.message || "Failed");
      } finally {
        if (tuneSerial === state.tuneSerial) state.tuning = false;
      }
    }

    async function rokuSend(path, body, action) {
      const { res, data, declined } = await rokuPost(path, body, action);
      if (declined) return false;
      if (!res.ok) {
        setStatus(apiErrorMessage(data, "The Roku did not take that"), "error");
        return false;
      }
      const lane = state.roku.lane;
      if (state.playing !== "roku" && lane && lane.stream && lane.stream.id) {
        watchRoku(lane.stream.id, ++state.tuneSerial);
      }
      pollRoku();
      return true;
    }

    els.rokuRemote.querySelectorAll("[data-key]").forEach(button => {
      button.addEventListener("click", () =>
        rokuSend("api/v1/roku/keypress", { key: button.dataset.key }, "use the remote"));
    });
    els.rokuTextForm.addEventListener("submit", async event => {
      event.preventDefault();
      const text = els.rokuText.value;
      if (!text) return;
      if (await rokuSend("api/v1/roku/text", { text }, "type on the Roku")) els.rokuText.value = "";
    });
    els.rokuApps.addEventListener("change", async () => {
      const appId = els.rokuApps.value;
      els.rokuApps.value = "";
      if (appId) await rokuSend("api/v1/roku/launch", { app_id: appId }, "launch an app");
    });
    els.rokuStop.addEventListener("click", () =>
      rokuSend("api/v1/roku/cancel", {}, "stop the Roku's navigation"));
    els.rokuDate.addEventListener("change", () => {
      if (!els.rokuDate.value) return;
      state.roku.date = els.rokuDate.value;
      loadRokuItems(true);
    });
    els.rokuLock.addEventListener("click", async () => {
      const held = state.locks && state.locks.roku;
      if (state.roku.lock && held && held.owner === ROKU_OWNER) {
        await fetch("api/v1/tuner/lock/release", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lane: "roku", token: rokuToken() }),
        });
        forgetRokuLock();
        pollLock();
        return;
      }
      const body = { lane: "roku", owner: ROKU_OWNER, duration_seconds: 3600, reason: "Manual Roku" };
      const claim = extra => fetch("api/v1/tuner/lock", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...body, ...extra }),
      });
      let res = await claim({});
      let data = await res.json().catch(() => ({}));
      if (res.status === 423 && data.lock) {
        if (!await confirmOverride(data.lock, "take the Roku for yourself")) return;
        res = await claim({ override: true });
        data = await res.json().catch(() => ({}));
      }
      if (res.ok && data.token) rememberRokuLock(data.token, data.lock.expires_at);
      else setStatus(apiErrorMessage(data, "Could not lock the Roku"), "error");
      pollLock();
    });

    // ---------- events ----------

    function selectSource(mode) {
      state.mode = mode;
      state.filter = "";
      els.filter.value = "";
      if (["tv", "roku"].includes(mode)) loadRokuItems(false);
      syncRokuPolling();
      render();
      renderRokuState();
      pollLock();
    }

    els.tabTv.addEventListener("click", () => selectSource("tv"));
    els.tabCable.addEventListener("click", () => selectSource("cable"));
    els.tabAntenna.addEventListener("click", () => selectSource("antenna"));
    els.tabRoku.addEventListener("click", () => selectSource("roku"));
    els.tabRadio.addEventListener("click", () => selectSource("radio"));

    els.filter.addEventListener("input", () => {
      state.filter = els.filter.value.trim().toLowerCase();
      renderList();
    });

    function showQuality(quality) {
      state.quality = quality;
      els.qualityGroup.querySelectorAll("button").forEach(b =>
        b.setAttribute("aria-selected", String(b.dataset.quality === quality)));
    }

    els.qualityGroup.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        showQuality(btn.dataset.quality);
        if (state.currentChannelId) tuneTv(state.currentChannelId);
        else if (state.currentCableChannel !== null) {
          tuneCable(state.currentCableChannel);
        }
      });
    });

    els.freqDown.addEventListener("click", () => stepFrequency(-1));
    els.freqUp.addEventListener("click", () => stepFrequency(1));

    document.addEventListener("keydown", (e) => {
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (!els.rokuRemote.hidden && !e.metaKey && !e.ctrlKey && !e.altKey) {
        const key = { ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left",
                      ArrowRight: "Right", Enter: "Select", Backspace: "Back" }[e.key];
        if (key && tag !== "BUTTON" && tag !== "SELECT") {
          e.preventDefault();
          rokuSend("api/v1/roku/keypress", { key }, "use the remote");
          return;
        }
      }
      if (e.key === "/") { e.preventDefault(); els.filter.focus(); }
      else if (state.mode === "radio" && e.key === "ArrowLeft") stepFrequency(-1);
      else if (state.mode === "radio" && e.key === "ArrowRight") stepFrequency(1);
    });

    // ---------- resume existing session ----------

    async function resume() {
      try {
        const res = await fetchWithFallback(
          "api/v1/status", "api/status", { cache: "no-store" }
        );
        const data = normalizeStatus(await res.json());
        if (state.tuneSerial) return;
        const sourceKind = data.source && data.source.kind;
        const stream = data.stream || {};
        const selection = data.selection;

        if (FM_UI_ENABLED && sourceKind === "fm" && data.fm && data.fm.playing) {
          state.mode = "radio";
          state.playing = "fm";
          state.currentFreq = data.fm.frequency;
          els.radioFreq.textContent = Number(data.fm.frequency).toFixed(1);
          const known = state.stations.find(
            s => Math.abs(s.frequency - data.fm.frequency) < 0.05);
          els.radioName.textContent = data.fm.station || (known ? known.name : "Unlisted");
          els.radioFormat.textContent = known && known.format ? known.format : "";
          els.radioStereo.textContent = data.fm.stereo ? "STEREO" : "MONO";
          render();
          startFmPlayback();
          setMeter(data.fm.signal);
          setStatus(`${Number(data.fm.frequency).toFixed(1)} MHz`, "live");
          setNowPlaying(els.radioName.textContent,
                        `${Number(data.fm.frequency).toFixed(1)} MHz · FM`);
          startSignalPolling();
          return;
        }

        showQuality(data.quality || "medium");

        if ((sourceKind === "cable" || sourceKind === "analog") && stream.active && selection) {
          state.playing = "cable";
          state.currentCableChannel = selection.channel;
          state.currentChannelId = null;
              state.streamId = stream.id;
          render();
          const displayMhz = Math.ceil(selection.frequency_hz / 1e6);
          setStatus(`Cable ${selection.channel}`, "busy");
          setNowPlaying(
            `Cable ${selection.channel}`,
            `${displayMhz} MHz · buffering`,
          );
          const resumeStreamId = state.streamId;
          await waitForTvStream(resumeStreamId);
          if (state.streamId !== resumeStreamId || state.tuneSerial) return;
          startTvPlayback(resumeStreamId, 0, () => {
            if (state.streamId !== resumeStreamId || state.tuneSerial) return;
            setStatus(`Cable ${selection.channel}`, "live");
            setNowPlaying(
              `Cable ${selection.channel}`,
              `${displayMhz} MHz · ${state.quality}`,
            );
          });
          return;
        }

        if (sourceKind === "digital" && stream.active && selection) {
          state.mode = "tv";
          state.playing = "tv";
          state.currentChannelId = selection.id;
          state.currentCableChannel = null;
              state.streamId = stream.id;
          render();
          setStatus(selection.name, "busy");
          setNowPlaying(selection.name,
                        `${digitalLabel(selection)} · buffering`);
          const resumeStreamId = state.streamId;
          await waitForTvStream(resumeStreamId);
          if (state.streamId !== resumeStreamId || state.tuneSerial) return;
          startTvPlayback(resumeStreamId, 0, () => {
            if (state.streamId !== resumeStreamId || state.tuneSerial) return;
            setStatus(selection.name, "live");
            setNowPlaying(selection.name,
                          `${digitalLabel(selection)} · ${state.quality}`);
          });
          return;
        }

        setStatus(`${tunableChannels().length} channels ready`);
        setNowPlaying("Nothing playing", "Idle");
      } catch (e) {
        setStatus("Server unreachable", "error");
      }
    }

    const loaders = FM_UI_ENABLED
      ? [loadChannels(), loadCableChannels(false), loadSources(false), loadStations()]
      : [loadChannels(), loadCableChannels(false), loadSources(false)];
    // The guide links here as #watch=youtube-tv%2FNBC to put a Roku channel
    // on, so the tune shows its progress and asks about a lock as usual. A
    // game (#watch=mlb%2F823254) is one of today's, as the games are listed.
    // The link is used once: a reload must not send the Roku off again.
    function linkedRokuTarget() {
      const match = /^#watch=(.+)$/.exec(location.hash);
      if (!match) return null;
      history.replaceState(null, "", location.pathname + location.search);
      let value;
      try { value = decodeURIComponent(match[1]); } catch (_) { return null; }
      const slash = value.indexOf("/");
      if (slash <= 0) return null;
      const source = state.roku.sources.find(s => s.id === value.slice(0, slash) && s.tunable !== false
        && (!s.dated || state.roku.date === localDate()));
      const item = source && (state.roku.items[source.id] || [])
        .find(i => String(i.id) === value.slice(slash + 1));
      return item ? { source, item } : null;
    }

    Promise.all(loaders).then(async () => {
      const rokuItems = loadRokuItems(true);
      syncRokuPolling();
      render();
      loadGuideNow();
      const linked = /^#watch=/.test(location.hash) ? await rokuItems.then(linkedRokuTarget) : null;
      if (linked) tuneRoku(linked.source, linked.item);
      else resume();
      startSourcePolling();
      // vizelVision links here as /tv/#roku to watch and drive the Roku.
      if (location.hash === "#roku" && state.roku.available) selectSource("roku");
    });
  })();
  </script>
</body>
</html>
